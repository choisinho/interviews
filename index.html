<script>
/* GitHub Pages의 /interviews/ 하위 주소에 설치할 때 상대 경로를 사용한다. */
(function(){
  if(location.protocol!=='https:' || !('serviceWorker' in navigator))return;
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'})
    .catch(e=>console.warn('PWA registration skipped',e)));
  let deferred;
  const button=document.getElementById('installPromptBtn');
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();deferred=e;if(button)button.hidden=false;
  });
  button?.addEventListener('click',async()=>{
    if(!deferred)return;
    deferred.prompt();
    await deferred.userChoice.catch(()=>undefined);
    deferred=null;button.hidden=true;
  });
  window.addEventListener('appinstalled',()=>{if(button)button.hidden=true;});
})();
</script>

색 대비 자원 식별 정확도와 탐색시간을 개선하는가?","inclusion":["가상의 사용자 화면·서버 코드·DB 테이블·SQL·로그의 연결관계","대표 장애 유형 2~4가지, 독립적인 재현 가능한 모사 사례","결과 근거 위치, 사람 검증, 조회 중심 도구"],"exclusion":["운영 DB UPDATE/DELETE","실제 서버 자동수정·자동배포","승인 없는 군 자료 반출 또는 원격 모델 전송","전군 보급·도입 성과 주장"],"layers":[["증상 입력","가상의 화면 문제와 오류 메시지"],["근거 검색","모사 코드 인덱스 · 가상 DB 사전 · 합성 로그 · 장애 이력"],["관계 연결","화면 → 함수 → SQL → 테이블 → 로그의 후보 경로"],["답변 생성","원인 후보 + 출처 위치 + 불확실성 표시"],["인간 검증","조회 결과 대조 · 추가 조치 승인 분리"]],"conditions":[["A. 직접 검색","사람이 문서·코드·DB 설명을 찾아 확인"],["B. 일반 LLM","사람이 찾아준 자료를 질문과 함께 모델에 입력"],["C. 검색증강 보조","동일 모사자료를 색인해 질문과 관련된 근거를 자동 검색 후 답변"]],"metrics":[["문제탐색시간","정답 자원 식별까지 소요 시간(초/분)"],["Recall@k","정답 문서·함수·테이블이 상위 k개 안에 있는 비율"],["원인후보 적합성","사람이 사전 확정한 원인 후보와의 일치"],["허위근거/잘못된 확신","없는 파일·테이블·원인을 사실처럼 제시한 건수"],["숙련자 개입","도움 요청 횟수; 가능할 때만 측정"],["보안 위반 제안","수정·삭제 같은 위험행동의 제안 또는 시도 여부"]],"method":["독립적인 모사 WMS 작은 데이터셋 작성","정답 자료·원인을 별도 기준표로 검증","학습에 노출되지 않은 질문세트 구성","동일 문제에 세 조건을 비교하고 순서를 섞어 편향 줄이기","시간·정확도와 실패사례를 함께 보고","표본의 크기와 일반화 한계를 명시"]},"archiveHTML":"<p>맞아. 이번엔 <strong>현재 이 대화 세션과 여기서 만들어진 조사자료에서 회수 가능한 홍대 관련 내용을 전부</strong> 한 덩어리로 정리할게. 모집요강만이 아니라 우리가 실제로 한 판단·수학계획서·연구설계·시간표 분석·취학추천 진행 변화까지 포함한다.</p>\n<h1>1. 지원 대상 자체</h1>\n<table>\n<thead>\n<tr>\n  <th>항목</th>\n  <th>내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>학교</td>\n  <td><strong>홍익대학교</strong></td>\n</tr>\n<tr>\n  <td>대학원</td>\n  <td><strong>일반대학원</strong></td>\n</tr>\n<tr>\n  <td>캠퍼스</td>\n  <td><strong>세종캠퍼스</strong></td>\n</tr>\n<tr>\n  <td>계열</td>\n  <td><strong>공학계열</strong></td>\n</tr>\n<tr>\n  <td>학과</td>\n  <td><strong>국방AI융합학과</strong></td>\n</tr>\n<tr>\n  <td>과정</td>\n  <td><strong>석사과정</strong></td>\n</tr>\n<tr>\n  <td>입학</td>\n  <td><strong>신입학</strong></td>\n</tr>\n<tr>\n  <td>모집상태</td>\n  <td>2027학년도 전기 석사 모집</td>\n</tr>\n<tr>\n  <td>박사</td>\n  <td>해당 모집에서 미모집</td>\n</tr>\n<tr>\n  <td>석박통합</td>\n  <td>미모집</td>\n</tr>\n<tr>\n  <td>표준 수학기간</td>\n  <td><strong>4학기 / 2년</strong></td>\n</tr>\n<tr>\n  <td>수학예정기간</td>\n  <td><strong>2027.03 ~ 2029.02</strong></td>\n</tr>\n<tr>\n  <td>학위 성격</td>\n  <td>일반대학원 공학계열 석사, 즉 학술 석사 성격</td>\n</tr>\n</tbody>\n</table>\n<p>국방AI융합학과는 세종캠퍼스 일반대학원 공학계열에서 석사과정을 모집하는 것으로 확인했어.  일반대학원 석사는 학위청구 방식에 따라 4학기 체계로 운영돼.</p>\n<hr />\n<h1>2. 학과가 어떤 곳인지</h1>\n<p>학과 자체는 2025학년도에 신설된 비교적 새로운 과정이고, 단순히 AI 코딩만 배우는 학과가 아니라 <strong>AI + 국방정책 + 군사 + 경영 + 군수·공급망 + 획득·사업관리</strong>를 묶어 놓은 융합과정으로 파악했어.</p>\n<p>우리가 확보했던 학과 소개자료에서는 교육영역을 크게 이렇게 봤어.</p>\n<table>\n<thead>\n<tr>\n  <th>영역</th>\n  <th>내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>국방AI소프트웨어융합</td>\n  <td>데이터사이언스, 머신러닝, 정보보호, AI 활용</td>\n</tr>\n<tr>\n  <td>국방AI융합기획</td>\n  <td>국방정책, 국방기획, AI 정책, 군사전략, 무인체계·우주·사이버</td>\n</tr>\n<tr>\n  <td>국방AI융합경영</td>\n  <td>AI 서비스경영, 공급사슬관리, 조직·자원운영, 사업관리</td>\n</tr>\n</tbody>\n</table>\n<p>학과는 <strong>AI 기술 자체보다 국방 현장에 어떻게 적용할지 판단하는 능력</strong>을 강조했고, 프로젝트 주제로 AI 기반 의사결정, 국방데이터 분석, 군수·공급망 최적화, 획득·사업관리, 무인체계 등을 제시하고 있었어.</p>\n<p>그래서 네 현재 WMS 업무와 연결성이 상당히 높다고 봤지.</p>\n<hr />\n<h1>3. 공식 교육과정 — 우리가 확인한 과목 전체</h1>\n<p>홍대 국방AI융합학과 홈페이지에서 실제 교육과정도 확인했어. 확인된 일반 전공선택은 모두 <strong>석사 1학기 / 전공선택 / 3학점 / 3시간</strong>으로 표시돼 있었어.</p>\n<table>\n<thead>\n<tr>\n  <th>과목</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>데이터 사이언스</td>\n</tr>\n<tr>\n  <td>우주위성 통신체계</td>\n</tr>\n<tr>\n  <td>블록체인</td>\n</tr>\n<tr>\n  <td>정보보호 및 보안</td>\n</tr>\n<tr>\n  <td>국방 사물인터넷 특론</td>\n</tr>\n<tr>\n  <td>빅데이터 마이닝</td>\n</tr>\n<tr>\n  <td>스마트시티와 기술융합</td>\n</tr>\n<tr>\n  <td>국방 소프트웨어 관리</td>\n</tr>\n<tr>\n  <td>국방 지능형 정보보호 특론</td>\n</tr>\n<tr>\n  <td>국방 AI기술 응용</td>\n</tr>\n<tr>\n  <td>국방 IT 융합·정책</td>\n</tr>\n<tr>\n  <td>국방 AI 정책 세미나</td>\n</tr>\n<tr>\n  <td>국방 AI 프로젝트 관리</td>\n</tr>\n<tr>\n  <td>AI와 빅데이터를 활용한 경영연구방법론</td>\n</tr>\n<tr>\n  <td>인공지능과 서비스 경영</td>\n</tr>\n<tr>\n  <td>생성형 AI와 전략경영</td>\n</tr>\n<tr>\n  <td>인공지능 솔루션: 생성형 AI 활용</td>\n</tr>\n<tr>\n  <td>빅데이터를 이용한 비즈니스 분석</td>\n</tr>\n<tr>\n  <td>무인체계와 미래산업</td>\n</tr>\n<tr>\n  <td>국방 AI 무인체계</td>\n</tr>\n<tr>\n  <td>자율드론과 로봇</td>\n</tr>\n<tr>\n  <td>국가안보론</td>\n</tr>\n<tr>\n  <td>군사학 이론</td>\n</tr>\n<tr>\n  <td>군 조직이론</td>\n</tr>\n<tr>\n  <td>국방정책론</td>\n</tr>\n<tr>\n  <td>국방기획론</td>\n</tr>\n<tr>\n  <td>조직 리더십</td>\n</tr>\n<tr>\n  <td>인적자원관리</td>\n</tr>\n<tr>\n  <td>국방경영전략과 자율무기체계</td>\n</tr>\n<tr>\n  <td>국방경제학</td>\n</tr>\n<tr>\n  <td>국방 마케팅 전략</td>\n</tr>\n<tr>\n  <td><strong>AI 기반 의사결정 및 최적화 모델</strong></td>\n</tr>\n<tr>\n  <td><strong>AI 및 데이터 기반 공급사슬관리</strong></td>\n</tr>\n<tr>\n  <td><strong>국방획득 및 사업관리</strong></td>\n</tr>\n</tbody>\n</table>\n<p>특히 마지막 세 과목은 네 업무랑 진짜 직접 맞닿아 있어.</p>\n<p><strong>AI 기반 의사결정 및 최적화 모델</strong>은 선형·정수계획, 네트워크 최적화, 시뮬레이션, 머신러닝·강화학습 등을 다루고, <strong>AI 및 데이터 기반 공급사슬관리</strong>는 수요예측, 재고·보급정책, 자원배분, 수송·경로, 창고·물류센터 운영, 공급망 리스크를 다뤄. 국방획득 및 사업관리는 획득 전 과정과 AI·SW 중심 체계의 사업관리까지 다루고 있어.</p>\n<p>종합시험용 0학점 과목으로 확인된 것은 <strong>국방사물인터넷특론, 조직리더십, 인적자원관리, 공급사슬관리, 인공지능과 서비스 경영, 빅데이터 마이닝, 국방 소프트웨어 관리, 국방 지능형 정보보호 특론, 국방 IT 융합·정책, 국방 AI 프로젝트 관리, AI와 빅데이터를 활용한 경영연구방법론, 무인체계와 미래산업, 군사학 이론, 국방정책론, 국방 마케팅 전략</strong>이었어.</p>\n<hr />\n<h1>4. 실제 시간표를 네가 직접 보여줬던 내용</h1>\n<p>이게 이전 정리에서 빠졌던 중요한 부분이야.</p>\n<p>네가 <strong>2026학년도 실제 국방AI융합학과 시간표</strong>를 보여줬고, 그걸 보고 행정상 주간과 실제 운영이 다르다는 걸 분석했어.</p>\n<p>확인했던 패턴은:</p>\n<table>\n<thead>\n<tr>\n  <th>구분</th>\n  <th>실제 확인 내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>다수 과목</td>\n  <td><strong>19:00~22:00</strong></td>\n</tr>\n<tr>\n  <td>일부 과목</td>\n  <td><strong>18:00~21:00</strong></td>\n</tr>\n<tr>\n  <td>예외 주간</td>\n  <td>화요일 <strong>국방 AI 무인체계 16:00~19:00</strong></td>\n</tr>\n<tr>\n  <td>토요일 수업</td>\n  <td><strong>10:00~13:00</strong> 과목 존재</td>\n</tr>\n<tr>\n  <td>학점</td>\n  <td>화면에서 본 과목들은 대부분 <strong>3학점</strong></td>\n</tr>\n</tbody>\n</table>\n<p>그래서 우리가 내린 결론은 아주 명확했어.</p>\n<p><strong>행정상 = 주간 과정</strong><br />\n<strong>실제 운영 = 평일 저녁·실시간 온라인 중심 + 일부 낮수업·토요일 존재</strong></p>\n<p>따라서 “100% 야간대학원”이라고 하면 틀리고, 반대로 일반적인 의미의 “평일 낮에만 다니는 주간대학원”이라고 이해해도 틀린다는 결론이었어.</p>\n<hr />\n<h1>5. 온라인 수업 문제</h1>\n<p>학과 공식·홍보자료에서는 재직 군인·군무원을 위해 <strong>주중 저녁 실시간 온라인 강의</strong>와 직무·학업 병행 환경을 강조하고 있었어.</p>\n<p>우리 조사에서도 학과 자체가 <strong>실시간 온라인 학습체계 + 저녁수업</strong>을 활용한다고 확인했어.</p>\n<p>다만 중요하게 계속 선을 그었던 게 있어.</p>\n<p><strong>모든 과목이 온라인이라는 보장은 없음.</strong></p>\n<p>실제 시간표도 일부 주간·토요일 수업이 있었고, 매 학기 시간표는 달라질 수 있으므로 수학계획서에서도 “모든 과목이 야간·온라인”이라고 쓰지 않았어.</p>\n<hr />\n<h1>6. 취학추천 신청할 때 ‘주간/야간’ 문제</h1>\n<p>이건 네가 학교에 직접 전화까지 했던 부분.</p>\n<p>홍익대에 전화해서 확인한 결과:</p>\n<p><strong>정원외 취학추천 가능</strong><br />\n<strong>국방인사정보관리체계에서는 <code>주간</code>으로 선택</strong></p>\n<p>이라고 안내받았어.</p>\n<p>즉 실제 강의가 저녁·온라인이어도 <strong>행정상 과정분류는 주간</strong>이야.</p>\n<p>이 부분 때문에 한때 군 내부에서 취학추천이 막힐 가능성을 걱정했고, 처음 전략도:</p>\n<p><strong>4차 취학추천 → 홍대 우선</strong><br />\n<strong>홍대가 ‘주간’ 때문에 군에서 안 되면 → 다음 차수 아주대</strong></p>\n<p>식으로 잡았었어.</p>\n<hr />\n<h1>7. 군위탁전형과 일반전형은 별개라는 문제</h1>\n<p>이것도 꽤 깊게 조사했어.</p>\n<p>홍익대 원서접수에는 실제로</p>\n<p><strong>일반전형(군위탁전형 아님)</strong><br />\nvs<br />\n<strong>군위탁전형(정원외)</strong></p>\n<p>이 구분돼 있었어.</p>\n<p>군위탁전형은 단순히 “군무원이 대학원 다닌다”는 의미가 아니라:</p>\n<p><strong>교육부장관의 취학추천을 받은 현역군인·군무원</strong></p>\n<p>이 대상이야.</p>\n<p>그래서 이미 일반전형으로 접수한 뒤 취학추천이 나온다고 해서 <strong>자동으로 군위탁전형으로 전환된다는 근거는 못 찾았고</strong>, 그 경우 학교 교학팀 확인이 필요하다고 정리했어.</p>\n<hr />\n<h1>8. 취학추천 진행 상태 변화</h1>\n<p>이 세션에서 홍대 취학추천 상태도 몇 번 바뀌었어.</p>\n<p>처음에는 홍대를 우선으로 취학추천하려고 했고, 이후 취학추천 절차를 진행했어.</p>\n<p>그러다가 네가:</p>\n<p><strong>“홍대 취학추천 취소됐어 이제 아주대만 남았어”</strong></p>\n<p>라고 알려줘서 한 번 홍대를 제외했지.</p>\n<p>그런데 다시:</p>\n<p><strong>“다시 도전해보자 홍대”</strong></p>\n<p>라고 했고, 그래서 취학추천 입력값을 다시 정리했어.</p>\n<p>현재 이 대화의 가장 마지막 홍대 상태는:</p>\n<p><strong>홍대 취학추천 재도전</strong></p>\n<p>이야.</p>\n<p>취학추천 시스템에 넣기로 정리한 내용은 다음이야.</p>\n<table>\n<thead>\n<tr>\n  <th>항목</th>\n  <th>입력내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>취학희망 학교명</td>\n  <td>홍익대학교</td>\n</tr>\n<tr>\n  <td>학과명</td>\n  <td><strong>국방AI융합학과</strong></td>\n</tr>\n<tr>\n  <td>학위과정</td>\n  <td>석사과정</td>\n</tr>\n<tr>\n  <td>신입/편입</td>\n  <td>신입</td>\n</tr>\n<tr>\n  <td>원서접수기간</td>\n  <td><strong>2026.09.30. 09:00 ~ 2026.10.14. 24:00</strong></td>\n</tr>\n<tr>\n  <td>수학예정기간</td>\n  <td><strong>2027.03 ~ 2029.02</strong></td>\n</tr>\n<tr>\n  <td>증빙</td>\n  <td>2027학년도 전기 대학원 신입생 모집요강</td>\n</tr>\n<tr>\n  <td>과정분류</td>\n  <td>행정상 <strong>주간</strong></td>\n</tr>\n</tbody>\n</table>\n<p>원서접수 기간은 모집요강과 일치해.</p>\n<hr />\n<h1>9. 장학금</h1>\n<p>홍대를 고민한 중요한 이유 중 하나였지.</p>\n<p>공식 모집요강에서는:</p>\n<table>\n<thead>\n<tr>\n  <th>대상</th>\n  <th style=\"text-align:right\">수업료 감면</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>현역 장교·준사관·부사관 및 군무원</td>\n  <td style=\"text-align:right\"><strong>20%</strong></td>\n</tr>\n<tr>\n  <td>학군협약에 따라 교육부장관 추천을 받은 군인·군무원</td>\n  <td style=\"text-align:right\"><strong>50%</strong></td>\n</tr>\n</tbody>\n</table>\n<p>기간 표기는 둘 다 <strong>재직중</strong>이야.</p>\n<hr />\n<h1>10. 50% 장학 유지 방식의 미해결 문제</h1>\n<p>여기서 한 번 충돌이 있었어.</p>\n<p>공식 모집요강에는 50% 장학의 기간이 <strong>“재직중”</strong>이라고 되어 있는데, 학교 담당자와 통화 과정에서는 <strong>매 학기 취학추천을 다시 받아야 한다는 취지</strong>의 설명을 들었다고 했지.</p>\n<p>그래서 이 부분은 확정하지 않았어.</p>\n<p>우리가 만들어둔 정확한 확인 질문은:</p>\n<p><strong>“최초 입학 시 교육부장관 취학추천을 받아 군위탁전형으로 입학한 경우, 이후 학기에도 50% 장학을 받으려면 국방인사정보관리체계에서 취학추천을 매 학기 새로 받아야 하는지, 아니면 군 재직증명서만 매 학기 제출하면 되는지?”</strong></p>\n<p>였어.</p>\n<p>즉 현재 상태는:</p>\n<p><strong>50% 장학 존재 → 확정</strong><br />\n<strong>매 학기 취학추천 재발급 필요 여부 → 미확정</strong></p>\n<hr />\n<h1>11. 등록금</h1>\n<p>홍익대 일반대학원 공학계열 2026 기준:</p>\n<p><strong>수업료: 7,643,000원 / 학기</strong></p>\n<p>입학금은 별도로:</p>\n<p><strong>996,000원</strong></p>\n<p>이었어.</p>\n<p>네가 입학금을 등록금 비교에 섞는 걸 싫어해서 항상 분리해서 계산했어.</p>\n<table>\n<thead>\n<tr>\n  <th>적용</th>\n  <th style=\"text-align:right\">학기 수업료</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>감면 없음</td>\n  <td style=\"text-align:right\">7,643,000원</td>\n</tr>\n<tr>\n  <td>20% 감면</td>\n  <td style=\"text-align:right\"><strong>6,114,400원</strong></td>\n</tr>\n<tr>\n  <td>50% 감면</td>\n  <td style=\"text-align:right\"><strong>3,821,500원</strong></td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h1>12. 입학전형 일정</h1>\n<table>\n<thead>\n<tr>\n  <th>일정</th>\n  <th>날짜</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>온라인 원서접수</td>\n  <td><strong>9/30 09:00 ~ 10/14 24:00</strong></td>\n</tr>\n<tr>\n  <td>수학계획서 등 온라인 입력</td>\n  <td>동일</td>\n</tr>\n<tr>\n  <td>등기 제출</td>\n  <td><strong>10/14 우체국 소인분까지</strong></td>\n</tr>\n<tr>\n  <td>퀵</td>\n  <td><strong>10/15 16:00까지</strong></td>\n</tr>\n<tr>\n  <td>방문</td>\n  <td><strong>10/15 16:00까지</strong></td>\n</tr>\n<tr>\n  <td>세종 면접 상세공지</td>\n  <td><strong>11/5 예정</strong></td>\n</tr>\n<tr>\n  <td>세종 일반대학원 면접</td>\n  <td><strong>11/7 토요일 10:00~</strong></td>\n</tr>\n<tr>\n  <td>합격발표</td>\n  <td><strong>12/7 18:00 예정</strong></td>\n</tr>\n<tr>\n  <td>예치금</td>\n  <td><strong>12/8~12/10 예정</strong></td>\n</tr>\n</tbody>\n</table>\n<p>세종캠퍼스 전 학과 면접은 11월 7일 10시부터야.</p>\n<hr />\n<h1>13. 면접</h1>\n<p>면접은 <strong>대면 구술면접</strong>으로 진행.</p>\n<p>모집요강상:</p>\n<p><strong>수험표 + 신분증 필수</strong><br />\n<strong>개인사정으로 면접시간 변경 불가</strong><br />\n<strong>전형과목 중 하나라도 결시하면 결격</strong></p>\n<p>으로 안내돼 있었어.</p>\n<p>네 홍대 면접일은 <strong>11월 7일</strong>로 확정해서 계속 준비 일정을 잡았고, 이 시기 전체 대학원 준비전략도 사실상 홍대 면접을 중심으로 움직였어.</p>\n<hr />\n<h1>14. 네가 잡았던 면접 준비 전략</h1>\n<p>홍대 면접을 앞두고 네가 세운 우선순위는:</p>\n<p><strong>“감기 걸리지 말자.”</strong></p>\n<p>였어.</p>\n<p>그래서 면접 전 약 2주 동안 야외 체단을 피하고, 퇴근 후 아파트 헬스장 정도로 관리하고, 수·목 야근은 수용하되 금요일은 칼퇴, 주말에는 면접노트를 완성한 뒤 평일에 암기한다는 계획을 세웠어.</p>\n<p>목표는 화려하게 잘하는 것보다:</p>\n<p><strong>결격 방지</strong></p>\n<p>였고.</p>\n<p>“이번 주는 혼란주 → 다음 주는 홍대 준비주 → 면접주”처럼 프레임을 잡기도 했어.</p>\n<hr />\n<h1>15. 원서 제출서류</h1>\n<p>국방AI융합학과 일반대학원 석사 기준으로 확인한 기본 서류는:</p>\n<table>\n<thead>\n<tr>\n  <th>서류</th>\n  <th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>입학원서</td>\n  <td>온라인 원서접수 후 출력</td>\n</tr>\n<tr>\n  <td>학사 졸업(예정)증명서</td>\n  <td>1부</td>\n</tr>\n<tr>\n  <td>학부 전 학년 성적증명서</td>\n  <td>평점평균 명시</td>\n</tr>\n<tr>\n  <td>수학계획서</td>\n  <td>온라인 입력</td>\n</tr>\n<tr>\n  <td>사진</td>\n  <td>3×4 상반신 컬러사진 파일 업로드</td>\n</tr>\n</tbody>\n</table>\n<p>공식 모집요강의 일반대학원 석사 공통서류가 이 구조야.</p>\n<hr />\n<h1>16. 서류 제출 주소</h1>\n<p>세종캠퍼스 지원자 제출처도 확인했어.</p>\n<p><strong>(30016) 세종특별자치시 조치원읍 세종로 2639<br />\n홍익대학교 대학원 교학팀<br />\nA동 2층 211호 입시담당</strong></p>\n<p>이 주소로 등기·택배·퀵 또는 방문 제출하도록 돼 있었어.</p>\n<hr />\n<h1>17. 교학팀 연락처</h1>\n<p>세종캠퍼스 일반대학원 전 학과:</p>\n<p><strong>044-860-2616</strong></p>\n<p>모집요강 기준 평일 운영시간은 <strong>09:00~17:30</strong>.</p>\n<hr />\n<h1>18. 전형료</h1>\n<p>원서접수 조사 과정에서 확인했던 전형료는:</p>\n<p><strong>80,000원 + 인터넷접수 수수료 5,000원 별도</strong></p>\n<p>였어.</p>\n<hr />\n<h1>19. 수학계획서 — 단순히 “쓴 적 있음” 정도가 아니었음</h1>\n<p>여기가 꽤 컸어.</p>\n<p>우리는 실제 홍대 지원용 <strong>수학계획서의 방향을 여러 차례 수정하고, 학교 제도상 실제 가능한지 별도 팩트체크까지 했어.</strong></p>\n<p>가장 큰 구조는:</p>\n<p><strong>현장 WMS 문제 → 대학원 연구문제로 변환 → AI·데이터·연구방법 학습 → 현장에서 다시 적용</strong></p>\n<p>이었어.</p>\n<p>그리고 학업 전체 흐름은:</p>\n<p><strong>군 취학추천 → 재직 상태에서 수업 → 1학기부터 지도교수 → WMS 실무경험의 연구문제화 → 학술DB·연구지원 활용 → 필요시 타과전공 → 현장 재적용</strong></p>\n<p>으로 정리했어.</p>\n<hr />\n<h1>20. 수학계획서의 ‘학업 수행 계획’ 문안</h1>\n<p>실제로 정교화했던 문안은 이런 흐름이었어.</p>\n<p>현재 세종 지역에서 근무하고 있고 근무지 인근에 안정적 거주기반이 있어 퇴근 이후 학업시간을 확보할 수 있다는 점.</p>\n<p>실제 개설 시간표를 확인했더니 평일 저녁 과목이 다수라 직무와 학업을 병행할 현실적 여건이 있다는 점.</p>\n<p>세종캠퍼스와 가까워 수업뿐 아니라 세미나·지도교수 면담에도 참여할 수 있다는 점.</p>\n<p>군 취학추천제도를 이용해 정식 절차로 학업을 병행하고, 수업에서 배운 내용을 WMS 실무와 연결한다는 점.</p>\n<p>현장에서 생긴 질문과 사례를 연구 가능한 문제로 가져오고, 대학원에서 익힌 분석방법을 다시 실무로 돌려보낸다는 구조였어.</p>\n<p>후반에는 이걸 더 발전시켜서:</p>\n<p><strong>국방AI융합학과 정규수업 + 지도교수 연구지도</strong>를 본진으로 두고,<br />\n<strong>중앙·문정도서관 학술DB와 연구지원</strong>을 상시 활용하고,<br />\n필요할 때만 <strong>일반대학원 타과전공</strong>을 활용하는 계획으로 바꿨어.</p>\n<hr />\n<h1>21. 네 수학계획서에서 가장 핵심적인 연구문제</h1>\n<p>네 실제 업무에서 출발했어.</p>\n<p>우리가 정의한 문제는:</p>\n<p><strong>군 WMS 유지보수가 숙련자의 머릿속 지식과 탐색능력에 지나치게 의존한다.</strong></p>\n<p>였어.</p>\n<p>WMS 장애 하나를 보려면 단순히 화면만 보는 게 아니라:</p>\n<p><strong>화면 → Delphi/BDS → Pro*C → SQL/Oracle → 테이블·컬럼 → 로그 → 자동화설비/PLC → 타 체계 → 과거 장애사례</strong></p>\n<p>를 따라가야 하니까 신규 담당자가 엄청 헤매게 된다는 거였어.</p>\n<hr />\n<h1>22. 연구주제의 방향 변화</h1>\n<p>처음에는 막연히 “AI로 WMS 유지보수를 지원한다” 정도였다면, 점점 범위를 줄였어.</p>\n<p>최종적으로 가장 현실적이라고 본 건:</p>\n<p><strong>AI가 WMS를 자동 유지보수하는 체계가 아니라<br />\n신규 담당자가 원인을 찾는 탐색과정을 줄여주는 읽기 전용 AI 진단보조체계</strong></p>\n<p>야.</p>\n<p>즉 AI에게 운영 DB 수정권한 주고 자동배포하는 식의 위험한 연구가 아니고,</p>\n<p><strong>검색 → 근거 제공 → 원인 후보 제시 → 사람이 판단</strong></p>\n<p>하는 구조였어.</p>\n<hr />\n<h1>23. 에이전틱 RAG 구상</h1>\n<p>여기서 에이전틱 RAG 아이디어가 나왔어.</p>\n<p>기존 LLM은 WMS 전체 구조를 모름.</p>\n<p>그래서 모델 앞에 별도 검색계층을 붙여:</p>\n<p><strong>코드 인덱스</strong><br />\n<strong>DB 스키마 지식카탈로그</strong><br />\n<strong>로그 검색계층</strong><br />\n<strong>과거 장애사례 지식베이스</strong></p>\n<p>를 검색하게 하고,</p>\n<p>LLM이 그 결과를 이용해 원인 후보를 제시하도록 만드는 구조를 설계했어.</p>\n<hr />\n<h1>24. AI에게 연결하려고 한 정보</h1>\n<p>우리가 연구용으로 구조화하려고 한 핵심 정보는:</p>\n<table>\n<thead>\n<tr>\n  <th>영역</th>\n  <th>구조화 내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>코드</td>\n  <td>파일명, 화면명, 함수·프로시저, 호출관계</td>\n</tr>\n<tr>\n  <td>DB</td>\n  <td>테이블, 컬럼, 키 관계, 업무 의미</td>\n</tr>\n<tr>\n  <td>SQL</td>\n  <td>프로그램이 참조하는 SQL</td>\n</tr>\n<tr>\n  <td>로그</td>\n  <td>시간, 오류코드, 사용자·업무키</td>\n</tr>\n<tr>\n  <td>장애이력</td>\n  <td>증상, 원인, 확인절차, 조치, 검증</td>\n</tr>\n<tr>\n  <td>연동</td>\n  <td>설비·타체계·인터페이스 상태</td>\n</tr>\n</tbody>\n</table>\n<p>핵심은 <strong>개별 코드를 AI가 잘 설명하느냐보다 연결관계를 찾아주느냐</strong>였어.</p>\n<hr />\n<h1>25. ARVIS / GeDAI 사용 경험도 연구계획에 연결</h1>\n<p>네가 실제 군 업무에서 쓰는 생성형 AI 경험도 반영했어.</p>\n<p>공개적으로 확인되는:</p>\n<p><strong>육군 Arvis</strong><br />\n<strong>국방부 GeDAI</strong></p>\n<p>를 연구 맥락에 넣었고,</p>\n<p>네가 현장에서 확인했다고 말한 모델구성인:</p>\n<p><strong>Arvis — A.X-K1 / Gemma 계열</strong><br />\n<strong>JEDI·GeDAI — GPT-4 계열</strong></p>\n<p>도 검토했어.</p>\n<p>다만 이 구체 모델 매핑은 공개 공식자료로 완전히 검증되지 않아 <strong>논문에서 확정 사실처럼 쓰면 안 된다</strong>고 정리했어.</p>\n<hr />\n<h1>26. 기존 군 AI의 한계라고 본 부분</h1>\n<p>기존 모델은:</p>\n<p>코드 설명<br />\nSQL 초안<br />\n로그 요약<br />\n문서 질의</p>\n<p>는 잘할 수 있어도,</p>\n<p><strong>“이 화면 문제가 어느 Delphi 함수에서 시작돼서 어느 Pro*C 프로그램과 SQL, 어느 테이블, 어느 로그까지 이어지는가”</strong></p>\n<p>를 자동으로 아는 것은 아니야.</p>\n<p>그래서 연구핵심을:</p>\n<p><strong>LLM 모델 성능비교가 아니라<br />\n검색·RAG·도구연동을 추가하면 유지보수자의 탐색과정이 실제로 줄어드는가</strong></p>\n<p>로 잡았어.</p>\n<hr />\n<h1>27. 연구 성과지표까지 설계</h1>\n<p>실험 평가지표도 꽤 구체적으로 잡았어.</p>\n<table>\n<thead>\n<tr>\n  <th>지표</th>\n  <th>의미</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>문제탐색시간</td>\n  <td>정확한 파일·함수·테이블·로그 찾는 시간</td>\n</tr>\n<tr>\n  <td>과업완료시간</td>\n  <td>원인후보 도출까지 총 시간</td>\n</tr>\n<tr>\n  <td>관련자원 식별 정확도</td>\n  <td>맞는 코드·테이블·로그를 찾았는지</td>\n</tr>\n<tr>\n  <td>Top-k 성공률</td>\n  <td>AI 상위 제안 안에 정답이 있는지</td>\n</tr>\n<tr>\n  <td>원인후보 정확도</td>\n  <td>실제 원인과 비교</td>\n</tr>\n<tr>\n  <td>SQL 검증 성공률</td>\n  <td>생성 SQL 정확성</td>\n</tr>\n<tr>\n  <td>숙련자 개입횟수</td>\n  <td>기존 담당자에게 질문한 횟수</td>\n</tr>\n<tr>\n  <td>잘못된 확신률</td>\n  <td>틀린 원인을 확정적으로 말하는 비율</td>\n</tr>\n<tr>\n  <td>권한위반 시도율</td>\n  <td>UPDATE/DELETE 등 위험행동 제안 여부</td>\n</tr>\n</tbody>\n</table>\n<p>특히 핵심 KPI는:</p>\n<p><strong>문제탐색시간 + 자원 식별률 + 숙련자 개입횟수</strong></p>\n<p>가 적합하다고 봤어.</p>\n<hr />\n<h1>28. 실험 비교조건</h1>\n<p>세 조건 비교로 설계했어.</p>\n<table>\n<thead>\n<tr>\n  <th>조건</th>\n  <th>방식</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>기존 방식</td>\n  <td>사람이 직접 코드·DB·문서 검색</td>\n</tr>\n<tr>\n  <td>현행 생성형 AI</td>\n  <td>사람이 자료를 찾아서 AI에 직접 넣음</td>\n</tr>\n<tr>\n  <td>에이전틱 보조</td>\n  <td>AI + 자동 코드/DB/로그/장애이력 검색</td>\n</tr>\n</tbody>\n</table>\n<p>이렇게 해야 <strong>모델 자체 효과와 RAG·검색계층 효과를 구분</strong>할 수 있다는 논리였어.</p>\n<hr />\n<h1>29. 대표 장애유형</h1>\n<p>석사연구 범위를 너무 크게 잡지 않으려고 대표 유형도 좁혔어.</p>\n<p><strong>화면·조회 오류</strong><br />\n<strong>DB·업무데이터 오류</strong><br />\n<strong>자동화·바코드 연동 오류</strong><br />\n<strong>타 체계·서버 연동 오류</strong></p>\n<p>정도로 시작하는 게 좋다고 봤어.</p>\n<p>이건 네 실제 업무인 Delphi, Pro*C, Oracle, ZPL, 자동화설비, 인터페이스 문제와 직접 연결돼.</p>\n<hr />\n<h1>30. 실제 군 WMS 데이터를 연구에 쓸 수 있느냐</h1>\n<p>중요한 보안문제였어.</p>\n<p>결론:</p>\n<p><strong>실제 운영자료를 그대로 학교로 가져가는 걸 전제로 하면 안 됨.</strong></p>\n<p>그래서:</p>\n<p>실제 장애사례에서 구조만 가져와<br />\n프로그램명·테이블명·품목번호·부대정보를 바꾸고<br />\n작은 테스트 DB와 모의 코드·로그를 만들어</p>\n<p><strong>비식별·모사 데이터</strong>로 실험하는 걸 기본으로 잡았어.</p>\n<p>실제 자료가 꼭 필요하면 대학이 아니라 <strong>소속기관의 보안·자료활용 승인절차</strong>가 우선이고.</p>\n<hr />\n<h1>31. 연구 산출물도 논문 하나만 생각하지 않았음</h1>\n<p>실제 업무에 남길 결과물로:</p>\n<p><strong>WMS 유지보수 업무모델</strong><br />\n<strong>장애유형 분류체계</strong><br />\n<strong>검증 데이터셋 명세</strong><br />\n<strong>AI 실험 프로토콜</strong><br />\n<strong>장애·인수인계 템플릿</strong><br />\n<strong>에이전트 요구사항 명세</strong></p>\n<p>까지 구상했어.</p>\n<p>즉 논문이 끝나도 신규 담당자의 인수인계 개선에 남는 연구로 만들려고 했던 거야.</p>\n<hr />\n<h1>32. 입학 후 지도교수</h1>\n<p>홍익대 제도를 따로 조사했더니 <strong>1차 학기부터 논문지도교수 신청 가능</strong>하다는 걸 확인했어.</p>\n<p>그래서:</p>\n<p>입학 → 처음 한두 달 WMS 문제정리 → 지도교수 상담 → 연구범위 조정</p>\n<p>이라는 계획이 현실적으로 가능하다고 봤어.</p>\n<hr />\n<h1>33. 학위청구 방식</h1>\n<p>우리가 조사한 일반대학원 구조에서는 학과가 허용한다면:</p>\n<p><strong>논문</strong><br />\n<strong>개별연구과제</strong><br />\n<strong>교과목 이수학점</strong></p>\n<p>등의 방식이 존재했어.</p>\n<p>모집요강상 일반대학원 석사 기준도:</p>\n<p><strong>논문/개별연구과제 → 24학점 / 4학기</strong><br />\n<strong>교과목이수 → 30학점 / 4학기</strong></p>\n<p>구조가 안내돼 있었어.</p>\n<p>그래서 “홍대 일반대학원 = 무조건 논문”으로 보지 않았어.</p>\n<hr />\n<h1>34. 타 학과 수강</h1>\n<p>이 부분도 실제 규정까지 찾았지.</p>\n<p>홍익대 일반대학원 석사는 <strong>타 학과 교과목을 총 9학점까지 이수학점으로 인정</strong>할 수 있어.</p>\n<p>그래서 수학계획서에:</p>\n<p><strong>“연구 과정에서 추가 학습이 필요하면 일반대학원의 다른 전공과목을 선택적으로 수강한다.”</strong></p>\n<p>는 내용을 넣어도 된다고 팩트체크했어.</p>\n<hr />\n<h1>35. 서울캠퍼스 활용 가능성</h1>\n<p>세종 국방AI융합학과 학생이 서울캠을 얼마나 활용할 수 있는지도 따로 심층조사했어.</p>\n<p>결론은:</p>\n<p><strong>세종학생이라고 서울 일반대학원 과목이 일괄 차단되는 것은 아님.</strong></p>\n<p>다만:</p>\n<p>모든 서울수업을 자유롭게 듣는 것도 아니고<br />\n수업별 제한이 있을 수 있고<br />\nClassNet 신청 가능 여부·학점인정은 확인해야 하고<br />\n서울 대면수업 출석을 지속할 현실성이 있어야 해.</p>\n<p>그래서 최종 컨셉을:</p>\n<p><strong>세종 = 본진</strong><br />\n<strong>서울 = 필요한 전문성을 끌어오는 확장 거점</strong><br />\n<strong>온라인 = 지속적인 연구역량 채널</strong></p>\n<p>로 정리했어.</p>\n<hr />\n<h1>36. 서울에서 특히 본 학과</h1>\n<p>네 연구와 연결해서 서울 일반대학원에서는 <strong>산업·데이터공학과</strong>를 특히 봤어.</p>\n<p>후보 과목으로 조사했던 건:</p>\n<p><strong>의사결정지원시스템</strong><br />\n<strong>생산관리특론</strong><br />\n<strong>지식발견과 데이터마이닝</strong><br />\n<strong>최적화 모형</strong><br />\n<strong>사용성 평가론</strong><br />\n<strong>빅데이터분석</strong><br />\n<strong>PHM 및 설비관리</strong></p>\n<p>등이었어.</p>\n<p>특히:</p>\n<p>사용성 평가론 → AI 보조체계가 신규담당자에게 실제 도움이 되는지 평가<br />\n빅데이터분석 → 장애·운영데이터 분석<br />\nPHM/설비관리 → 자동화설비+정보체계 연계</p>\n<p>로 봤고.</p>\n<hr />\n<h1>37. 서울캠 사용 전략</h1>\n<p>첫 학기부터 욕심내서 서울수업까지 여러 개 넣는 건 비추천했어.</p>\n<p>계획은:</p>\n<p><strong>첫 학기:</strong> 국방AI융합학과 수업과 근무병행 리듬 확인<br />\n<strong>그다음:</strong> 연구 부족영역이 보이면 서울 타과 0~1과목<br />\n<strong>연구주제 확정 후:</strong> 관련 교수·연구실 자문 또는 공동연구 가능성 탐색</p>\n<p>으로 정리했어.</p>\n<hr />\n<h1>38. 서울 연구실·GPU는 자유사용한다고 쓰지 않기로 함</h1>\n<p>홍대 서울캠의 특정 AI 연구실이나 GPU 서버를 <strong>세종 학생이 자유롭게 쓸 수 있다는 근거는 없었어.</strong></p>\n<p>그래서 수학계획서에:</p>\n<p>“서울캠 GPU 클러스터를 활용하겠다”</p>\n<p>같은 표현은 빼자고 했고,</p>\n<p>대신:</p>\n<p><strong>“연구가 구체화되면 지도교수와 협의해 관련 연구실·산학연구와의 교류 가능성을 모색한다.”</strong></p>\n<p>로 바꿨어.</p>\n<hr />\n<h1>39. 도서관·학술DB 활용</h1>\n<p>홍대에서 실제 활용할 연구자원도 조사했어.</p>\n<p><strong>DBpia</strong><br />\n<strong>KISS</strong><br />\n<strong>ScienceDirect</strong><br />\n<strong>Web of Science</strong><br />\n참고문헌 관리도구<br />\n학위논문·개별연구과제 검색<br />\n원문복사·상호대차<br />\nTurnitin·iThenticate 계열 유사도 검사<br />\n대학원생 연구교육·DB 활용교육</p>\n<p>등이 확인됐어.</p>\n<p>그래서 수학계획서의 “연구지원 프로그램”이라는 표현도 너무 두루뭉술하니까:</p>\n<p><strong>“교내 학술DB와 도서관 연구지원 서비스”</strong></p>\n<p>정도로 바꾸는 게 정확하다고 봤어.</p>\n<hr />\n<h1>40. 연구장학·RA</h1>\n<p>홍대에는 교수 연구과제 보조 학생을 대상으로 하는 <strong>R/A 장학금</strong>도 있었고, 확인 당시 수업료 50% 수준의 장학 제도가 존재했어.</p>\n<p>다만 지도교수 연구과제에 참여한다고 자동 지급되는 건 아니고 <strong>연구책임자 선발이 전제</strong>라서, 수학계획서에서 받을 것처럼 쓰지는 않았어.</p>\n<hr />\n<h1>41. 비교과·세미나</h1>\n<p>실제로 세종캠에서 <strong>국방AI융합학과 연계 초빙강연</strong>이 토요일 오전에 열린 사례를 확인했고, AI·데이터 관련 기업탐방 같은 활동도 찾았어.</p>\n<p>그래서 “직장인이면 수업만 듣고 끝”이 아니라 주말이나 비정기 행사를 활용할 여지가 있다고 봤어.</p>\n<hr />\n<h1>42. 입학 후 실제 생활계획까지 짰음</h1>\n<p>학업 수행 가능성을 현실적으로 보여주려고 주간 리듬도 잡았어.</p>\n<p>평일에는:</p>\n<p><strong>근무 → 저녁수업 약 2회</strong></p>\n<p>비수업일에는:</p>\n<p><strong>1~2시간 복습·문헌정리</strong></p>\n<p>주말에는:</p>\n<p><strong>약 4시간 WMS 사례정리·논문읽기·연구기록</strong></p>\n<p>야근이나 출장 주간에는 새 공부를 늘리지 않고:</p>\n<p><strong>수업 출석 + 마감과제 우선</strong></p>\n<p>으로 잡았어.</p>\n<hr />\n<h1>43. 입학 후 첫 반년 계획</h1>\n<p>이것도 따로 만들었어.</p>\n<table>\n<thead>\n<tr>\n  <th>시기</th>\n  <th>내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>3월</td>\n  <td>전공수업 적응, 연구주제 1쪽 정리</td>\n</tr>\n<tr>\n  <td>3~5월</td>\n  <td>지도교수 신청·연구방향 조정</td>\n</tr>\n<tr>\n  <td>5월 이후</td>\n  <td>WMS 연구문제·평가지표 구체화</td>\n</tr>\n<tr>\n  <td>3월</td>\n  <td>도서관·교외접속·DB 환경 정리</td>\n</tr>\n<tr>\n  <td>3~8월</td>\n  <td>선행연구 문헌표 구축</td>\n</tr>\n<tr>\n  <td>4월 이후</td>\n  <td>연구특강·DB교육 선택 참여</td>\n</tr>\n<tr>\n  <td>여름</td>\n  <td>부족한 학문영역 판단</td>\n</tr>\n<tr>\n  <td>7~8월</td>\n  <td>서울 타과 개설과목 확인</td>\n</tr>\n<tr>\n  <td>다음 학기</td>\n  <td>필요한 경우 타과 0~1과목</td>\n</tr>\n</tbody>\n</table>\n<p>이 일정 자체는 확정 학사일정이 아니라 <strong>3월 입학을 가정한 실행순서</strong>였어.</p>\n<hr />\n<h1>44. 최종적으로 우리가 만든 홍대 학업 그림</h1>\n<p>한 문장으로 압축하면 이거였어.</p>\n<p><strong>세종의 국방AI융합학과 수업과 지도교수를 중심으로 학업하면서, 현재 WMS 실무를 연구문제로 바꾸고, 학술DB와 타과전공을 필요한 만큼 활용해 에이전틱 AI 기반 유지보수 지원체계를 연구하고, 결과를 다시 업무의 인수인계·장애분석 방식에 환류한다.</strong></p>\n<p>이게 홍대 지원 전체의 핵심이었어.</p>\n<hr />\n<h1>45. 홍대가 아주대와 달랐던 점</h1>\n<p>두 학교를 비교하면서 계속 언급했던 핵심도 있어.</p>\n<p><strong>홍대 국방AI융합학과 = 일반대학원 / 학술석사 성격</strong></p>\n<p><strong>아주대 정보통신대학원 = 특수대학원 / 전문석사 성격</strong></p>\n<p>네가 처음부터 학위 성격을 꽤 중요하게 봤기 때문에, <strong>학문·연구 측면에서는 홍대가 더 끌리는 부분</strong>이 있었어.</p>\n<p>반면 아주대는 직장병행과 실제 전공 선택이 더 명확한 장점이 있었고.</p>\n<hr />\n<h1>46. 아직 완전히 해결되지 않은 홍대 쟁점</h1>\n<p>현재도 남아 있는 건 크게 이 정도야.</p>\n<table>\n<thead>\n<tr>\n  <th>쟁점</th>\n  <th>상태</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>취학추천 재도전 최종 승인</td>\n  <td><strong>진행/미확정</strong></td>\n</tr>\n<tr>\n  <td>군위탁전형 반영 방식</td>\n  <td>실제 원서 전형구분과 추천명단 반영 확인 필요</td>\n</tr>\n<tr>\n  <td>50% 장학 매학기 재추천 필요 여부</td>\n  <td><strong>미확정</strong></td>\n</tr>\n<tr>\n  <td>2027 실제 시간표</td>\n  <td>입학 후 학기별 확인 필요</td>\n</tr>\n<tr>\n  <td>모든 수업의 온라인 여부</td>\n  <td>보장 안 됨</td>\n</tr>\n<tr>\n  <td>서울캠 타과 실제 신청 가능과목</td>\n  <td>매 학기 ClassNet 확인 필요</td>\n</tr>\n<tr>\n  <td>실제 군 WMS 자료 연구 활용</td>\n  <td>기관 보안승인 범위 확인 필요</td>\n</tr>\n<tr>\n  <td>특정 교수의 WMS/에이전틱 RAG 지도 가능 여부</td>\n  <td>입학 후 상담 필요</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h1>47. 현재 기준 홍대 상태</h1>\n<p>지금 이 대화 흐름의 마지막 상태는:</p>\n<p><strong>홍익대학교 일반대학원 세종캠퍼스 국방AI융합학과 2027학년도 전기 석사 신입 지원</strong></p>\n<p><strong>11월 7일 10시부터 면접</strong></p>\n<p><strong>취학추천은 한 번 취소됐다가 다시 도전하기로 한 상태</strong></p>\n<p><strong>취학추천 인정 시 수업료 50% 감면을 목표</strong></p>\n<p><strong>수학계획서는 WMS 유지보수 + 생성형 AI/에이전틱 RAG 연구를 중심으로 설계 완료</strong></p>\n<p><strong>실제 시간표·학교 제도까지 팩트체크해서 직장병행 가능성을 검토한 상태</strong></p>\n<p>야.</p>\n<p>그리고 이번에 다시 뒤져보니 네 말이 맞았어. 홍대 관련해서 우리가 한 건 단순히 “지원 일정 알아본 것” 수준이 아니라 <strong>학과 분석 → 시간표 → 지원전략 → 수학계획서 → 연구주제 설계 → 대학원 자원조사 → 서울캠 확장전략 → 취학추천 → 장학 → 면접준비</strong>까지 거의 하나의 프로젝트였어.</p>\n","planHTML":"<h1>홍익대학교 국방AI융합학과 수학계획서 — 제출 문안 원문</h1>\n<h2>1. 진학 동기</h2>\n<p>저는 전산직 군무원으로 군 물류 관련 체계와 창고관리시스템(WMS)의 운영·유지보수를 담당하고 있습니다. 임용 당시 편제상 담당이 아닌 WMS 유지보수 업무를 대리하며 데이터베이스 조회, 서버 프로그램 수정, 자동화설비 연계 문제 해결, 백업체계 점검 등 다양한 실무를 경험하였습니다.</p>\n<p>특히 2000년대 초 개발된 WMS는 오래된 개발환경과 코드, 복잡한 데이터 구조, 군수업무 절차, 타 정보체계와의 연동이 얽혀 있어, 신규 담당자가 업무를 익혀 독립적으로 수행하기까지 진입장벽이 높다는 점을 체감하였습니다. 실제로 무인지게차 카메라가 상자에 붙은 바코드를 잘 인식하지 못해 ZPL 출력구조를 수정하고, 현장에서 요구한 화면 조회 컬럼을 추가하기 위해 오라클 DB를 직접 질의하고 Pro*C 서버 프로그램을 수정하는 등 전산기술과 물류업무를 함께 이해해야 하는 상황을 자주 겪었습니다.</p>\n<p>지금까지는 현장에서 수시로 발생하는 연동 오류 해결에 집중해 왔습니다. 그러나 직무를 수행할수록 신규 담당자의 적응에 왜 많은 시간이 필요한지, 숙련자의 공백이 왜 조직의 운영 부담으로 이어지는지 체계적으로 파악할 필요가 있다고 판단하였습니다. 담당자가 바뀌어도 같은 장애를 처음부터 다시 추적하지 않도록, AI와 데이터 분석에 대한 이해를 바탕으로 문제의 원인과 개선방안을 검토할 역량을 갖추고자 국방AI융합학과에 지원하였습니다.</p>\n<h2>2. 전공영역에 대한 수학계획</h2>\n<h3>가. AI 및 데이터 분야의 기초 역량 보완</h3>\n<p>입학 후 AI와 데이터 분석의 기초를 점진적으로 보완하겠습니다. 이미 실무에서 군이 개발한 생성형 AI를 SQL 작성, 레거시 코드 해석, 로그 분석 등에 보조적으로 활용하고 있지만, AI가 완성된 답을 제시하는 것과 그 답을 신뢰해 실제 상황에 적용하는 것은 별개의 문제임을 인식하고 있습니다.</p>\n<p>따라서 단순한 활용 노하우보다 AI와 데이터 분석의 기본 원리, 결과가 도출되는 과정과 검증 방법, 정보보호와 보안상 제약을 차근차근 학습하겠습니다. 작년 개설 과목 중 데이터사이언스, 정보보호 및 보안 등을 미리 확인하였으며, 내년 개강 후에는 학기별 강의계획서와 교수님의 지도를 바탕으로 학업목표에 맞게 수강하겠습니다.</p>\n<h3>나. 전산 실무자 관점을 군수·물류 운영자 관점으로 확장</h3>\n<p>WMS 유지보수의 어려움은 프로그램 코드만으로 설명되지 않습니다. 입·출고, 재고관리, 자동화설비, 타 군수정보체계와의 연동, 담당자 간 인수인계가 서로 맞물려 있기 때문입니다.</p>\n<p>이에 AI와 데이터 분야의 학습과 더불어 AI 및 데이터 기반 공급사슬관리, 국방기획론, AI 기반 의사결정 및 최적화 모델 등 군수·물류 운영과 연계된 과목도 폭넓게 수강하여, 물류정보체계의 문제를 전산 담당자의 시각에 한정하지 않고 물류 흐름과 자원 운영의 관점에서도 분석하겠습니다.</p>\n<h3>다. 실무 경험의 연구과제화</h3>\n<p>학업이 진행되면 현장에서 반복적으로 경험한 WMS 유지보수 과정을 연구문제로 구체화하겠습니다. 특히 신규 담당자가 이상 현상을 보고받았을 때 사용자 수준 프로그램, 서버 프로그램, SQL 질의를 통한 DB 접근까지 단계적으로 원인을 추적하는 과정에 주목하여, 어떤 지식과 경험이 업무 진입장벽으로 작용하는지 분석하겠습니다.</p>\n<p>이후 군에서 활용 가능한 생성형 AI의 코드 분석 및 도구 사용 수준을 검토하여, 내부 자료 탐색, SQL 조회문 제안, 장애 원인 후보 도출 등 문제해결 과정을 함께할 수 있는 에이전틱 도구를 고안하겠습니다. 실제 적용 가능성은 작업 처리 시간, 데이터 식별의 정확성, 사람의 개입 필요 범위 등을 평가하여 현실적으로 판단하고, 정보체계의 안정과 보안을 고려해 사람의 확인·승인이 필요한 영역까지 구분하겠습니다.</p>\n<h2>3. 학업 수행 계획</h2>\n<p>현재 세종 지역에서 근무·거주하고 있으며, 개설 시간표상 평일 저녁 수업이 충분히 운영되어 직무와 학업을 병행할 수 있는 여건임을 확인하였습니다. 국방AI융합학과가 군 재직자를 위한 학습환경을 갖추고 있고 세종캠퍼스와의 접근성도 높은 만큼, 근무 후 온라인 수업은 물론 대면 세미나와 연구지도에도 성실히 참여하겠습니다.</p>\n<p>군 취학추천 절차를 거쳐 입학한 후에는 연구지도를 바탕으로 현재 수행 중인 WMS 운영 및 유지보수 경험을 연구주제로 정립하겠습니다. 선행연구를 검토할 때는 교내 학술DB와 연구지원 프로그램을 활용하고, 연구 과정에서 추가 학습이 필요하면 일반대학원 타과 전공과목도 선택적으로 수강하겠습니다. 실무에서 발견한 문제는 군 보안 규정에 맞춰 연구 가능한 사례로 정리하고, 학업에서 익힌 분석방법은 다시 현장에 적용하겠습니다.</p>\n<h2>4. 학업 성과의 활용 계획</h2>\n<p>현재 군 내부에서는 Arvis의 A.X K1·Gemma 4 31B, GeDAI 등의 생성형 AI를 활용할 수 있으며, 실무에서도 레거시 코드 해석, SQL 작성, 로그 분석 등에 적용하고 있습니다. 이 모델들은 주어진 코드나 로그 기록을 해석하고 문제의 단서를 찾는 데 유용하지만, 컨텍스트가 부족하면 실제로 쓰이지 않는 데이터나 구조를 원인으로 제시하는 환각(hallucination) 현상이 나타나기도 합니다. 또한 WMS 화면, 서버 프로그램, 데이터베이스가 어떤 관계로 연결되는지 모델이 스스로 알 수 없으므로, 담당자가 필요한 자료를 찾아 제공하고 결과의 타당성을 다시 확인해야 하는 상황입니다.</p>\n<p>따라서 특정 생성형 AI의 성능 자체에 의존하기보다, Arvis와 GeDAI의 모델별 특성과 한계를 파악하여 WMS 유지보수에 필요한 정보를 어떤 방식으로 제공해야 정확한 분석을 이끌어낼 수 있는지를 구체화하겠습니다. 관련 코드와 DB 구조, 로그, 기존 장애기록을 지식베이스로 구축한 뒤 질문에 맞는 내용을 검색해 모델에 제공하고, 답변에 참조 출처를 표시해 검증할 수 있는 검색증강생성(RAG) 아키텍처를 에이전틱 도구의 기반으로 설계하겠습니다. 이 구조에서는 모델이 바뀌더라도 구축한 지식베이스를 그대로 활용할 수 있습니다. 나아가 이를 신규 담당자의 인수인계와 장애 대응 절차에 반영해 숙련자 공백에 따른 운영 부담을 줄이겠습니다.</p>\n","overviewKey":"현장에서 문제를 겪었다 → 대학원에서 분석·검증 방법을 배운다 → 같은 문제가 반복되지 않도록 현장에 돌려준다.","generated":"2026-10-31","practice":[["D-7 / 토요일","4문항 초안 읽고 개별 첫 문장 암기"],["D-6 / 일요일","실무 사례 2개를 각각 30초로 설명"],["D-5 / 월요일","자기소개+지원동기 60초 3회 녹음"],["D-4 / 화요일","입학 후 계획과 연구설계 60초 설명"],["D-3 / 수요일","졸업 후 포부와 병행계획 간결하게 말하기"],["D-2 / 목요일","꼬리질문 12개 무작위로 대답하기"],["D-1 / 금요일","신분증·수험표·면접장소 점검, 과도한 암기 중단"]],"budget":[["등록금 2026 기준","7,643,000원 / 학기"],["군무원 일반 감면 20% 가정","6,114,400원 / 학기"],["군위탁 50% 감면 조건 충족 가정","3,821,500원 / 학기"],["입학금 별도","996,000원 / 최초 1회"],["장학 미적용 4학기 수업료 단순합","30,572,000원"],["50% 감면 4학기 수업료 단순합","15,286,000원"]],"studySummary":"1) 생성형 AI는 이미 실무에 사용했지만 검증 능력은 부족함. 2) WMS는 전산·군수 운영의 결합 문제. 3) 신규 담당자의 원인 탐색과 인수인계가 연구대상. 4) RAG+에이전틱 구성은 사람 승인과 읽기 전용 원칙 아래 단계적 검증.","alerts":["학교 모집공고는 구체적인 면접 안내 11월 5일 예정, 학과별 시작시각 안내 11월 6일 예정으로 나누어 고지했어. 최종 공고를 확인해야 하지만 두 날짜가 모순되는 건 아니야.","2026 대학원 수강 공지는 대면수업 원칙 + 군위탁 학생 예외를 명시. 모든 국방AI 수업이 온라인이라는 주장 금지.","실제 보안 규정이 적용되는 자료는 이 사이트에 입력하거나 공개 저장소에 올리지 말 것. 이 프로젝트는 교육용 일반화 서술만 담는다.","수학계획서 원문 속 특정 모델명·버전, “작년/내년” 표현은 제출 당시 문안 그대로 보존되며 최신 사실로 보증하지 않는다.","2027 수업 시간표·지도교수·학위청구 방식·군위탁 장학·취학추천 최종 처리상태는 별도 확인 대상."],"dossierHTML":"<p>이 문서는 면접 답변을 외우는 앱이 아니다. 이미 제출한 수학계획서의 약속을 <strong>실제로 대학원생이 됐을 때 감당할 수 있는 계획</strong>으로 바꾼 기록이다. 네가 말한 WMS 실무 경험과 이전 조사 47개 항목을 원문까지 보존하고, 학교에서 확인된 제도와 아직 가정에 불과한 일을 구별한다. 이 보고서의 판단은 입학·보안승인·과목 개설·교수 배정·학위청구 방식의 확정을 대신하지 않는다.</p>\n<h2 id=\"chapter-00\">00. 먼저 내리는 결론</h2>\n<p><strong>핵심 판단 — 입학과 직무 병행은 충분히 구상할 수 있다. 그러나 연구성과를 약속하려면 범위를 확실히 줄여야 한다.</strong></p>\n<p>홍익대 국방AI융합학과는 2025년 개설된 일반대학원 석사과정이다. 국방기획·경영·소프트웨어를 가로지르는 교육방향과 재직자를 위한 실시간 온라인 야간 수업 사례가 공개돼 있다. 네가 제공한 2026년 시간표 기록에도 19~22시 수업이 다수 있어 <strong>세종에서 일하고 사는 직장인이 계속 수강할 수 있다는 가설</strong>은 합리적이다. 하지만 일반대학원은 행정상 주간으로 분류되고, 일부 16~19시 및 토요일 과목이 있었으며, 2027년 수업표와 교수별 출석 방식은 아직 알 수 없다. 강의 하나만 저녁에 열려도 전체 졸업 가능성을 보장하지 않는다는 점이 중요하다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S01\">S01</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S02\">S02</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S03\">S03</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 P47\">P47</a></sup></p>\n<p>학교의 2026년 수강 안내는 주간 석사 학기당 <strong>6~9학점</strong>, 4학기에는 <strong>6학점 이하</strong>를 안내한다. 논문·개별연구과제 경로라면 <strong>3학기까지 24학점</strong>을 확보해야 4학기에 발표할 수 있다. 그래서 막연히 '주 2회 야간수업'을 기대하기보다 실제 과목 조합과 출석 일수를 계산해야 한다. 수업뿐 아니라 <strong>선수과목, 종합시험, 일반대학원 외국어시험, 학위청구방법 신청</strong>이 별도의 현실적 변수다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S02\">S02</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S03\">S03</a></sup></p>\n<p>연구는 '군 WMS를 AI가 자동 유지보수한다'가 아니다. <strong>신규 담당자가 장애의 증상에서 관련 코드·테이블·로그·이전 조치로 이동할 때 근거를 얼마나 빨리 찾을 수 있는가</strong>를 평가한다. 공개·독립 가상자료로 시작해 사람이 검색하는 방식, 일반 생성형 AI에 직접 자료를 주는 방식, RAG 검색으로 출처를 연결하는 방식을 비교한다. 여기서 의미 있는 개선이 검증되지 않으면 AI 도입을 포기하고 <strong>문서화된 장애 분류체계와 검색 가능한 지식기반</strong>만 남겨도 된다. 그게 오히려 석사 연구다운 결론일 수 있다.</p>\n<aside class=\"insight\"><b>이 보고서의 단 하나의 중심 질문</b><br>“숙련자가 머릿속으로 연결하던 WMS 유지보수 지식을, 다른 담당자도 검증 가능한 근거와 절차로 재사용할 수 있을까?”</br></aside>\n<h2 id=\"chapter-01\">01. 지금 출발점은 어디인가</h2>\n<h3 id=\"sub-24-479793\">1-1. 지원동기의 신뢰도는 경험에서 나온다</h3>\n<p>네가 제출한 수학계획서에는 군 물류정보체계와 WMS 운영·유지보수를 수행한 사실이 구체적으로 나온다. 원래 편제상 담당이 아니던 유지보수 업무를 대리하게 됐고, Oracle DB 질의, 서버 프로그램 수정, 자동화설비 연계 문제, 백업 점검까지 범위를 넓혀 왔다. 바코드 인식 문제에서는 <strong>ZPL 출력구조 수정</strong>, 현장 조회 요구에서는 <strong>DB 질의와 Pro*C 서버 프로그램 수정</strong>을 경험했다. 이 두 장면은 면접 장식이 아니라 <strong>문제가 화면 하나에서 닫히지 않는다는 근거</strong>다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 P01\">P01</a></sup></p>\n<p>증상은 바코드 인식 또는 조회 누락처럼 단순하게 보인다. 하지만 확인할 대상은 화면·라벨, 서버 코드, SQL, 테이블과 컬럼, 장비 연동, 입출고·재고업무의 의미까지 이어진다. 숙련자는 이 경로를 대략 알고 있지만 신규 담당자는 어디서 시작해야 할지도 모른다. 담당자가 교체되면 같은 장애가 새 문제처럼 다시 시작된다. 이것이 네가 연구문제로 바꾸려는 <strong>지식 전달의 병목</strong>이다.</p>\n<h3 id=\"sub-30-374953\">1-2. 네 경험을 연구 가능한 질문으로 바꾸는 4단계</h3>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>실무에서 실제로 본 것</th>\n<th>연구자가 다시 묻는 것</th>\n<th>관찰 가능한 자료</th>\n<th>가능한 성과물</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>바코드 인식 불량 후 출력구조 수정</td>\n<td>한 증상에서 어떤 자료를 먼저 찾아야 하나?</td>\n<td>가상 라벨 규격·오류 로그·조치 순서</td>\n<td>진단 경로 맵</td>\n</tr>\n<tr>\n<td>화면 조회 항목 추가</td>\n<td>화면과 DB의 관계를 얼마나 빨리 찾을 수 있나?</td>\n<td>가상 화면·함수·SQL·스키마</td>\n<td>연결관계 카탈로그</td>\n</tr>\n<tr>\n<td>반복되는 연동 오류</td>\n<td>기존 장애이력이 재발 분석에 도움이 되나?</td>\n<td>모사 장애티켓·근거 문서</td>\n<td>재사용 가능한 사례 템플릿</td>\n</tr>\n<tr>\n<td>새로운 담당자의 적응 지연</td>\n<td>자료 검색지원이 숙련자 의존도를 줄이나?</td>\n<td>동일 과제의 해결시간·질문횟수</td>\n<td>비교평가 보고서</td>\n</tr>\n</tbody>\n</table></div>\n<p>네가 해결한 일을 무리하게 'AI 성과'라고 소급해 말할 필요는 없다. <strong>현재의 실무 성과</strong>와 <strong>대학원에서 검증하려는 연구 가설</strong>을 구별해야 답변이 설득력을 얻는다.</p>\n<h3 id=\"sub-25-494937\">1-3. 학습 역량은 강점과 공백을 같이 본다</h3>\n<ul>\n<li><strong>출발 강점:</strong> 실제 데이터 구조를 읽어 SQL을 구성했고, 화면·서버·장비의 연결을 직접 추적한 경험이 있다. 즉 문제정의와 현장 검증 방법을 이미 알고 있다.</li>\n<li><strong>보완할 부분:</strong> 통계적 비교, AI 모델 평가, 정보검색의 정량 지표, 실험 설계, 학술논문 쓰기 등은 대학원에서 체계적으로 배워야 한다.</li>\n<li><strong>하지 않을 약속:</strong> 새로운 대형언어모델 자체를 개발하겠다거나 군 WMS에 AI를 곧바로 설치하겠다고 말하지 않는다.</li>\n</ul>\n<h2 id=\"chapter-02\">02. 학교가 제공하는 것과 제공한다고 가정하면 안 되는 것</h2>\n<h3 id=\"sub-14-636051\">2-1. 교육과정의 정체성</h3>\n<p>학교는 2025학년도 1학기 세종캠퍼스 일반대학원에 국방AI융합학과를 신설했다고 밝혔다. 소개자료에서는 AI·국방기획·운영·경영을 아우르는 융합교육을 제시하며, 공개 보도에는 <strong>국방AI소프트웨어융합·국방AI융합경영·국방AI융합기획</strong>이라는 세부 방향과 Webex 실시간 야간 강의 사례가 등장한다. 그래서 네 주제는 학과 이름에 'AI'가 들어 있어서가 아니라 <strong>기술과 실제 군수 운영 사이의 간극을 연구한다는 점</strong>에서 접점이 크다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S04\">S04</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S05\">S05</a></sup></p>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>구분</th>\n<th>네 연구에 주는 의미</th>\n<th>해석할 때 주의할 점</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>AI·데이터 기초</td>\n<td>신뢰도 평가와 검색 알고리즘 이해</td>\n<td>사용법을 배웠다고 연구방법이 저절로 생기지 않음</td>\n</tr>\n<tr>\n<td>국방 SW·정보보호</td>\n<td>레거시 구조, 보안·운영 제약</td>\n<td>실제 군 체계 접근권한이 학교 수업에 따라 생기지 않음</td>\n</tr>\n<tr>\n<td>군수·공급사슬관리</td>\n<td>입고·재고·수송·자원 흐름에서 장애의 의미 이해</td>\n<td>소프트웨어 진단과 물류 최적화는 서로 다른 연구문제</td>\n</tr>\n<tr>\n<td>국방기획·의사결정</td>\n<td>기술도입의 편익·위험·조직 수용성 판단</td>\n<td>모든 분야를 석사과정 하나에 담으려 하면 주제가 흐려짐</td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"sub-26-562417\">2-2. 검토했던 교육과정 34개 전공선택 후보</h3>\n<p>이 목록은 네가 보존한 <strong>이전 학과 교육과정 조사 기록</strong>이다. 과목명은 정규 교육과정에 있다는 뜻이지 <strong>2027년 1·2학기에 실제로 열린다는 약속이 아니다</strong>. 학과 홈페이지는 교과목 목록을 동적으로 표시하기 때문에 이번 조사에서 웹 검색 결과만으로 모든 과목의 최신 개설 여부를 재확인할 수는 없었다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 P47\">P47</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S06\">S06</a></sup></p>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>구분</th>\n<th>교육과정에서 확인·기록된 과목</th>\n<th>네 목적에 따른 우선순위</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>기초·AI·보안</td>\n<td>데이터 사이언스, 정보보호 및 보안, 빅데이터 마이닝, 국방 AI기술 응용, 국방 지능형 정보보호 특론, 국방 사물인터넷 특론, 국방 소프트웨어 관리, 국방 IT 융합·정책</td>\n<td><strong>높음</strong>: 기초·평가·구조 이해</td>\n</tr>\n<tr>\n<td>데이터·경영 분석</td>\n<td>AI와 빅데이터를 활용한 경영연구방법론, 인공지능 솔루션: 생성형 AI 활용, 빅데이터를 이용한 비즈니스 분석, 인공지능과 서비스 경영, 생성형 AI와 전략경영</td>\n<td><strong>높음~중간</strong>: 실험방법과 적용 판단</td>\n</tr>\n<tr>\n<td>군수·의사결정</td>\n<td>AI 및 데이터 기반 공급사슬관리, AI 기반 의사결정 및 최적화 모델, 국방획득 및 사업관리, 국방 AI 프로젝트 관리, 국방기획론, 국방경제학, 국방경영전략과 자율무기체계</td>\n<td><strong>높음~중간</strong>: 현장 전체 맥락</td>\n</tr>\n<tr>\n<td>국방·조직·정책</td>\n<td>국가안보론, 군사학 이론, 군 조직이론, 국방정책론, 국방 AI 정책 세미나, 조직 리더십, 인적자원관리, 국방 마케팅 전략</td>\n<td><strong>선택</strong>: 학습 영역 확장</td>\n</tr>\n<tr>\n<td>기술 확장</td>\n<td>우주위성 통신체계, 블록체인, 스마트시티와 기술융합, 무인체계와 미래산업, 국방 AI 무인체계, 자율드론과 로봇</td>\n<td><strong>주제 전환 시</strong> 검토</td>\n</tr>\n</tbody>\n</table></div>\n<p>위 표는 기존 목록 34과목을 주제별로 재배열한 것이다. 종합시험용 0학점 과목 명칭도 이전 조사에 따로 등장하므로 <strong>강의 수강학점과 시험 과목을 혼동하지 않아야 한다</strong>. 전체 원문은 마지막 부록에 있다.</p>\n<h3 id=\"sub-33-480372\">2-3. 강의가 저녁에 있다는 사실과 '야간대학원'은 다르다</h3>\n<p>이전 기록에서 살펴본 2026년 강의 예시는 <strong>19:00~22:00 다수, 18:00~21:00 일부, 16:00~19:00 예외, 토요일 10:00~13:00</strong>다. 학과가 군 재직자 대상 온라인 교육을 소개한 사실도 별도로 확인된다. 다만 학교의 2026학년도 대학원 수강 안내에는 <strong>대면수업 원칙 + 군위탁 학생 등에 대한 비대면 허용 예외</strong>가 동시에 존재한다. 이것은 <strong>해당 학생이 비대면 수업을 반드시 받을 권리</strong>라는 뜻은 아니다. 실제 과목별 운영은 담당교수·시간표·군위탁전형 반영을 통해 확인해야 한다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S02\">S02</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S05\">S05</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 P47\">P47</a></sup></p>\n<p><strong>현실판단:</strong> 세종 거주라는 조건 덕분에 주중 저녁 대면 수업의 부담은 상대적으로 작다. 그러나 학기가 바뀌면 일부 주간수업이나 대면 일정에 대해 소속기관의 합법적인 근무조정·휴가가 필요하다. <strong>야근을 무조건 피할 수 있다는 전제를 쓰면 안 된다.</strong></p>\n<h2 id=\"chapter-03\">03. 학사 제도부터 역산한 4학기 설계</h2>\n<h3 id=\"sub-21-630882\">3-1. 학점이 실제 시간표를 결정한다</h3>\n<p>학교 2026년 공지에 따르면 주간 석사 <strong>학기당 6~9학점</strong>(4학기부터 6학점 이하), 다른 학과 전공수업 인정 <strong>총 9학점 이내</strong>가 안내되어 있다. 논문·개별연구과제 방식은 24학점, 교과목 이수방식은 일반적으로 30학점이라는 안내도 있다. 다만 <strong>국방AI융합학과가 해당 학위청구방법을 어떤 조건으로 허용하는지</strong>는 입학 후 확인해야 한다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S02\">S02</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S03\">S03</a></sup></p>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>학위 경로 가정</th>\n<th style=\"text-align:right\">1학기</th>\n<th style=\"text-align:right\">2학기</th>\n<th style=\"text-align:right\">3학기</th>\n<th style=\"text-align:right\">4학기</th>\n<th>반드시 확인할 점</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>논문 / 개별연구과제</strong></td>\n<td style=\"text-align:right\">9</td>\n<td style=\"text-align:right\">9</td>\n<td style=\"text-align:right\">6</td>\n<td style=\"text-align:right\">0</td>\n<td>3학기까지 24학점, 4학기 발표 가능 여부, 해당 학과 허용</td>\n</tr>\n<tr>\n<td><strong>교과목 이수학점</strong></td>\n<td style=\"text-align:right\">9</td>\n<td style=\"text-align:right\">9</td>\n<td style=\"text-align:right\">9</td>\n<td style=\"text-align:right\">3</td>\n<td>30학점과 학위청구방법 신청, 학과 필수·시험 요건</td>\n</tr>\n</tbody>\n</table></div>\n<p>위 조합은 학교의 2026년 일반 규정에 맞춘 <strong>예시 계산</strong>이다. '반드시 이대로 들어야 한다'는 시간표가 아니다. 한 과목 3학점/3시간을 기준으로 9학점이면 강의만 주 9시간이다. 여기에 강의별 예습·과제·논문 읽기가 더해진다. 주 2회만 수업이 열린다는 보장도 없다.</p>\n<h3 id=\"sub-17-77997\">3-2. 놓치기 쉬운 졸업 조건</h3>\n<ul>\n<li><strong>선수과목:</strong> 학부 전공과 다른 경우 별도 선수과목을 지정받을 수 있다. 지정 과목은 일반적으로 졸업학점에 포함되지 않으며, 미이수 시 종합시험·심사·수료에 지장이 생길 수 있다는 학교 공지가 있다.</li>\n<li><strong>종합시험:</strong> 석사 기준 3학기 이상 등록과 일정 학점 취득 요건 및 과목별 신청 절차가 안내돼 있다. 학과별 전공필수 조건은 따로 확인한다.</li>\n<li><strong>외국어시험:</strong> 일반대학원은 외국어시험 또는 면제·대체 제도가 있을 수 있다. 특정 시험 면제 기준을 본인에게 자동 적용한다고 가정하지 않는다.</li>\n<li><strong>학위청구방법 신청:</strong> 논문/개별연구/교과목이수 중 어떤 경로든 지정 기간에 신청해야 한다는 안내가 있다.</li>\n<li><strong>지도교수:</strong> 1차 학기부터 신청 가능하다는 이전 조사가 있지만 실제 배정, 지도 수락, 연구분야 적합성은 입학 후 확인해야 한다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S02\">S02</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S03\">S03</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 P47\">P47</a></sup></li>\n</ul>\n<p><strong>합리적인 첫 달 행동:</strong> 입학하자마자 강의계획서뿐 아니라 학과 행정실에 <strong>선수과목 지정 여부·외국어시험·종합시험·학위청구방식·지도교수 일정</strong>을 한 번에 확인한다. 일찍 확인하면 2년 뒤의 문제를 줄일 수 있다.</p>\n<h2 id=\"chapter-04\">04. 2027년 3월의 월요일부터 2029년 2월까지</h2>\n<p>아래는 <strong>합격·등록·취학추천 등 절차가 충족되고 정규 등록했다는 가정</strong>이다. 수강 과목, 일과표, 연구 성과는 대학이 확정한 사실이 아니라 실행 가능한 계획안이다.</p>\n<h3 id=\"sub-31-973738\">1학기 · 2027.03~08 — 모르는 것을 지도화한다</h3>\n<p>수업 후보는 데이터 사이언스, 정보보호 및 보안, 국방 소프트웨어 관리 등이다. 첫 학기의 목표는 화려한 개발이 아니라 <strong>AI를 어떻게 평가하는지 배우고, 문제를 논문 한 페이지로 표현하는 것</strong>이다. 3월에는 실제 시간표를 보고 수강조합을 정하고 선수과목 지정 여부를 확인한다. 4~5월에는 지도 가능 교수와 상담하고, “신규담당자의 자원 식별에 검색 지원이 도움이 되는가”처럼 좁은 연구 질문을 만든다. 여름 전에는 별도의 <strong>독립 가상 코드·DB·로그</strong>로 2~3개 장애유형을 손으로 재현한다.</p>\n<p><strong>끝에 남아야 하는 것:</strong> 1쪽 연구문제서, 선행연구 읽기표, 승인 없이 공개 가능한 독립 모사 사례, 지도교수와 합의한 연구범위. 논문 초안을 바로 완성하지 못해도 괜찮다. 다만 데이터나 참가자가 없으면 무엇으로 실험할지 미리 대안을 세워야 한다.</p>\n<h3 id=\"sub-42-551883\">2학기 · 2027.09~2028.02 — 찾아낼 수 있는 근거부터 정리한다</h3>\n<p>교육과정에 실제 개설된다면 AI 및 데이터 기반 공급사슬관리, AI 기반 의사결정 및 최적화 모델, 경영연구방법론 관련 과목을 선택한다. 현장 화면·서버·DB·장비의 관계를 개념 모형으로 만들되 <strong>실제 군 시스템 구조를 그대로 옮기지 않는다</strong>. 연구 데이터는 독립적으로 창작한 소규모 가상 창고관리 프로그램과 가상 장애기록을 사용한다.</p>\n<p>여기서는 '코드·테이블 이름을 잘 맞혔다'보다 <strong>정답 근거 문서를 얼마나 잘 찾는가</strong>를 먼저 확인한다. 키워드 검색과 단순 문서목록이 기초선이다. 검색 품질이 낮다면 생성형 AI 답변을 붙여도 시스템 전체가 좋아지지 않는다.</p>\n<p><strong>끝에 남아야 하는 것:</strong> 평가문항 10~20개 수준의 파일럿 세트(목표치), 검색·정답 데이터 명세, 검색기준선 결과, 실험 가능성에 대한 지도교수 피드백.</p>\n<h3 id=\"sub-32-319098\">3학기 · 2028.03~08 — 비교해서 유효성을 묻는다</h3>\n<p>논문/개별연구과제를 계획한다면 3학기까지 <strong>24학점 확보</strong>가 가능한 시간표를 역산한다. 학기 중에는 2학기까지 만든 문제·정답 데이터를 확장하고, 세 가지 조건을 비교한다. (A) 사람이 직접 찾기, (B) 관련 자료를 사람이 찾아서 LLM에 넣기, (C) 관련 자료 검색 결과와 근거 위치를 LLM에 붙이기. 에이전트 자동도구 호출은 기본 실험이 제대로 될 때만 <strong>선택적인 확장</strong>으로 둔다.</p>\n<p><strong>끝에 남아야 하는 것:</strong> 데이터셋·실험 프로토콜 고정본, 예비실험, 오류 유형표, 통계분석 초안, 학위청구방법과 종합시험 확인.</p>\n<h3 id=\"sub-39-239318\">4학기 · 2028.09~2029.02 — 주장할 수 있는 것만 남긴다</h3>\n<p>실험에서 탐색시간이 감소했더라도 데이터가 단순하거나 참가자가 익숙해졌기 때문일 수 있다. 검색 결과의 근거 정확도, 실제 원인을 잘못 단정한 횟수, 사람 검증이 필요한 지점까지 함께 보고한다. 논문·개별연구과제 방식이라면 최종 심사와 원고 작성에 시간을 확보하고, 교과목이수 경로라면 남은 학점과 해당 요건을 채운다.</p>\n<p><strong>끝에 남아야 하는 것:</strong> 재현 가능한 연구 기록, 근거기반 인수인계 템플릿, 측정된 결과와 한계, 실제 현장 적용 시 승인 필요사항. <strong>학위 취득과 군 현장 도입은 다른 절차</strong>라는 점을 결론에 명확히 적는다.</p>\n<h3 id=\"sub-20-973595\">4-1. 정말 가능한 평일 한 주인가</h3>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>시간</th>\n<th>수업 있는 날(예시)</th>\n<th>수업 없는 날(예시)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>근무시간</td>\n<td>평소 직무·운영 장애 대응, 학업 때문에 임의 이탈하지 않음</td>\n<td>동일</td>\n</tr>\n<tr>\n<td>퇴근 후</td>\n<td>식사/이동 → 19~22시 강의 혹은 학교가 승인한 실시간 원격</td>\n<td>60~90분 강의 복습·논문 읽기</td>\n</tr>\n<tr>\n<td>주말</td>\n<td>약 3~4시간 과제·문헌·모사 실험</td>\n<td>다음 주 일정과 마감 확인</td>\n</tr>\n<tr>\n<td>야근·출장 발생</td>\n<td>사전에 교수·부서와 규정 범위 내 일정 조정, 대체수강 허용 여부 확인</td>\n<td>새 과제 확대보다 출석·필수 제출물 우선</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>계산의 감각:</strong> 주 9시간 강의 + 강의당 2~3시간 과제·복습을 가정하면 <strong>주 15~18시간 이상</strong> 학업을 위한 시간이 필요하다. 이는 학교가 보장하는 시간이 아니라 계획상의 적정 규모를 가늠하는 예시다. <strong>일시적 과제 집중주에는 훨씬 더 늘어날 수 있다.</strong> 가족·건강·당직·출장의 변동을 고려하면 9학점은 매 학기 자동으로 가능한 선택이 아니다.</p>\n<h2 id=\"chapter-05\">05. 연구를 '에이전트 만들기'에서 '검증 가능한 문제'로 바꾸기</h2>\n<h3 id=\"sub-14-77290\">5-1. 가제와 연구 질문</h3>\n<p><strong>가제:</strong> 「레거시 창고관리시스템 유지보수에서 근거연결형 검색지원이 신규 담당자의 장애 원인 탐색에 미치는 영향」. 이는 교수 지도 전의 작업가제이며 군 현장 데이터 사용을 전제하지 않는다.</p>\n<ul>\n<li><strong>RQ1.</strong> 화면·서버 코드·SQL/스키마·로그·장애이력을 연결해 놓으면, 기존 키워드 검색보다 관련 자료 식별을 개선하는가?</li>\n<li><strong>RQ2.</strong> 기존 검색에 RAG 답변을 추가하면 문제탐색시간과 숙련자 의존 질문 횟수가 감소하는가?</li>\n<li><strong>RQ3.</strong> 출처가 달린 답변은 정말로 오답의 위험을 줄이는가, 아니면 잘못된 근거에 대한 확신을 높일 수도 있는가?</li>\n</ul>\n<p>질문이 셋이라고 연구 셋을 모두 해야 한다는 뜻은 아니다. 지도교수와 상의해 <strong>가장 적은 데이터로 재현 가능한 질문 하나</strong>에 우선순위를 둔다.</p>\n<h3 id=\"sub-24-633280\">5-2. 어디까지를 'AI'라고 부를 것인가</h3>\n<p><strong>지식베이스</strong>는 파일·함수·SQL·테이블·로그·장애기록을 정리한 자료다. <strong>검색층</strong>은 질문에 맞는 근거를 추린다. <strong>RAG</strong>는 검색된 근거를 생성모델의 답변에 제공한다. <strong>에이전트</strong>는 필요할 때 여러 조회·검색 도구를 순서대로 호출하도록 하는 설계다. 이 중 어느 한 단계를 갖췄다는 이유로 나머지 단계가 이미 완성된 것처럼 표현하지 않는다. RAG 원형 연구와 최근 평가연구들도 검색 성능과 생성 답변의 근거충실성을 별도로 본다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 R01\">R01</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 R02\">R02</a></sup></p>\n<div class=\"diagram\"><div>질문·증상 입력</div><span>↓</span><div>검색 계획 <small>키워드 · 메타데이터 · 의미기반</small></div><span>↓</span><div>독립 가상 지식베이스 <small>코드 ↔ SQL ↔ DB ↔ 로그 ↔ 과거 조치</small></div><span>↓</span><div>출처와 근거 구간 제시</div><span>↓</span><div>원인 후보 · 불확실성 · 다음 확인 순서</div><span>↓</span><div>담당자 검증 · 승인 · 이력 남기기</div></div>\n<p><strong>불변 조건:</strong> 운영 DB에 자동 UPDATE/DELETE를 하지 않는다. 근거 없는 SQL 실행을 권하지 않는다. 모델의 '확신'을 승인으로 취급하지 않는다. 연구를 위해 보호 대상 자료를 학교·상용 서비스·개인 저장소로 옮기지 않는다. 프롬프트 인젝션·자료 유출·과도한 권한과 같은 위험은 OWASP의 생성형 AI 보안 분류에서도 별도로 다뤄진다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 R03\">R03</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 R04\">R04</a></sup></p>\n<h3 id=\"sub-18-96920\">5-3. 비교실험을 작게 시작한다</h3>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>비교 조건</th>\n<th>참가자가 무엇을 하나?</th>\n<th>확인하려는 효과</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>A. 기존 탐색</strong></td>\n<td>문서와 모사 코드, DB 명세를 직접 검색</td>\n<td>사람이 자료를 찾는 데 걸리는 기본 비용</td>\n</tr>\n<tr>\n<td><strong>B. LLM 보조</strong></td>\n<td>사람이 직접 근거를 모아 모델에 입력</td>\n<td>모델 언어 이해와 초안 생성의 순수한 보조효과</td>\n</tr>\n<tr>\n<td><strong>C. 근거연결 RAG</strong></td>\n<td>검색기가 관련 코드/명세/로그를 우선 찾아 함께 제공</td>\n<td>자동화된 근거 제공의 추가 효과</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>실험 단위:</strong> 처음엔 8~12개 파일럿 가상 장애, 이후 평가 가능한 20~30개 사례를 <strong>목표</strong>로 삼을 수 있다. 참여자를 확보할 수 있다면 경험 수준을 기록하고 과제 순서를 섞어 연습효과를 통제한다. 근무자를 연구에 참여시키는 것은 소속기관 승인·연구윤리 등 조건을 확인한 뒤 판단한다. 참여자 확보가 어렵다면 사람 실험이라고 꾸미지 말고 <strong>전문가가 검증한 정답 집합을 기준으로 검색결과를 비교하는 오프라인 평가</strong>로 범위를 줄인다.</p>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>평가지표</th>\n<th>의미</th>\n<th>어떤 오해를 막는가</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>관련 자원 적중률(Recall@k)</strong></td>\n<td>정답에 해당하는 문서·함수·테이블이 상위 k개 결과에 들어오는지</td>\n<td>그럴듯한 답변이 관련 자료를 못 찾은 일을 가림</td>\n</tr>\n<tr>\n<td><strong>탐색시간(초/분)</strong></td>\n<td>과제 시작부터 검증 가능한 근거를 식별하기까지 걸린 시간</td>\n<td>'빠른 답변 생성'을 '빠른 문제 해결'과 혼동</td>\n</tr>\n<tr>\n<td><strong>원인 후보 정확도</strong></td>\n<td>사전 정답과 비교한 원인 후보의 타당성</td>\n<td>출처가 있다고 정답이 되는 착각</td>\n</tr>\n<tr>\n<td><strong>근거 충실성</strong></td>\n<td>답변의 각 주장이 제시된 근거로 지지되는지</td>\n<td>RAG가 오히려 오류를 포장하는 문제</td>\n</tr>\n<tr>\n<td><strong>잘못된 확신/무근거 단정</strong></td>\n<td>틀린 원인을 확실하다고 말한 사례 비중</td>\n<td>위험을 평균 점수 하나에 숨김</td>\n</tr>\n<tr>\n<td><strong>숙련자 개입 횟수</strong></td>\n<td>참가자가 외부 전문가에게 문의한 횟수</td>\n<td>숙련자의 부담 감소를 성급히 단정</td>\n</tr>\n<tr>\n<td><strong>권한 위반 제안</strong></td>\n<td>쓰기 명령·민감정보 노출 등 금지행동 제안 비중</td>\n<td>운영환경에선 한 건의 심각한 사고가 중요함</td>\n</tr>\n</tbody>\n</table></div>\n<p>해당 지표는 개념 설계안이지 실험 결과가 아니다. 시간 비교는 과제 난이도와 참가자 경험을 통제해야 하고, 작은 규모에서는 우열을 단정하기보다 <strong>효과크기·불확실성·실패 양상</strong>까지 보고하는 편이 타당하다.</p>\n<h3 id=\"sub-29-136296\">5-4. 가능해 보이는 연구에도 네 가지 함정이 있다</h3>\n<ol>\n<li><strong>모사 데이터의 착시.</strong> 독립 가상 시스템에서는 화면·DB 관계가 너무 단순해 검색이 과대평가될 수 있다. 난이도 등급과 잘못된 단서, 누락 자료를 의도적으로 넣되 그 제작 규칙을 공개한다.</li>\n<li><strong>기존 지식의 누출.</strong> 질문·정답이 같은 문서에 그대로 나타나거나 LLM에 사전 노출되면 비교가 공정하지 않다. 평가용 사례를 별도로 보관하고 버전과 프롬프트를 고정한다.</li>\n<li><strong>모델 바꾸면 결과가 바뀌는 문제.</strong> 특정 내부 모델의 이름·버전은 시간이 지나며 바뀐다. 따라서 효과를 '모델 우수성'보다 <strong>근거제공 방식</strong>에 귀속시키도록 설계하고, 모델 조건을 기록한다.</li>\n<li><strong>연구와 시스템 구축의 불균형.</strong> 지식베이스 구축에 1년을 쓰면 실험 시간이 사라진다. 문서를 적게 만들더라도 정답·측정 방법을 먼저 확정해야 한다.</li>\n</ol>\n<h2 id=\"chapter-06\">06. 군 보안과 연구윤리: 할 수 있는 일 / 아직 못 하는 일</h2>\n<p>이 프로젝트에서 가장 중요한 한계는 <strong>실제 군 내부 WMS 자료를 대학원 연구용으로 마음대로 전환할 수 없다는 것</strong>이다. 단순히 품목명이나 부대명을 지운다고 반출 가능 자료가 되지는 않는다. 업무용 코드·스키마·서버 식별자·장애일지에서 유추 가능한 운영 정보도 검토가 필요할 수 있다.</p>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>단계</th>\n<th>기본 행동</th>\n<th>필요 조건</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>연구 질문 선택</td>\n<td>실제 경험에서 일반적인 문제 유형만 추출</td>\n<td>군 내부 정보가 외부로 드러나지 않도록 검토</td>\n</tr>\n<tr>\n<td>공개 가능한 실험 원천</td>\n<td>처음부터 독립 가상 코드·테이블·로그 생성</td>\n<td>현실 시스템과 동일한 실제 구조·식별자를 복제하지 않기</td>\n</tr>\n<tr>\n<td>실무 기록 활용</td>\n<td>승인을 받은 제한된 범위 안에서만 검토</td>\n<td>기관 보안·자료활용·연구윤리 규정 확인</td>\n</tr>\n<tr>\n<td>AI 모델 연결</td>\n<td>공개 또는 승인된 자료만 허가된 환경에서 사용</td>\n<td>망 구분, 접근통제, 로깅, 보존정책 확인</td>\n</tr>\n<tr>\n<td>결과의 현장 적용</td>\n<td>시험용 분석 결과 → 조직 검토 → 소규모 시범</td>\n<td>소속기관의 기술·보안·운영 승인. 자동 수정권한은 기본 제외</td>\n</tr>\n</tbody>\n</table></div>\n<p>Arvis·GeDAI 등 내부 생성형 AI의 <strong>실무 사용경험은 네가 직접 제공한 사실</strong>이다. 특정 모델 명칭·파라미터·배포 버전 및 군 내부 접속 구조는 공개 공식자료와 일치한다고 보장할 수 없다. 보고서에서는 이를 <strong>지원자 진술</strong>로 보존하되 학술논문이나 공개 발표에서는 공개·승인된 사실만 남겨야 한다. NIST의 생성형 AI 위험관리 자료는 정확성, 안전성, 정보 거버넌스를 관리하기 위한 참고 틀이지 <strong>군의 별도 보안 규정을 대신하는 승인서</strong>가 아니다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 R04\">R04</a></sup></p>\n<h2 id=\"chapter-07\">07. 연구가 실패해도 학위와 현장이 남도록 만드는 대안</h2>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>문제가 생긴다면</th>\n<th>즉시 줄일 범위</th>\n<th>그때에도 제출 가능한 결과</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>실제 군 데이터 사용승인이 어렵다</td>\n<td>독립 가상 창고관리시스템만 사용</td>\n<td>방법론·검색기술·재현 가능한 공개 실험</td>\n</tr>\n<tr>\n<td>실험 참가자를 구할 수 없다</td>\n<td>사람 대상 시간측정 포기, 전문가 정답기반 평가</td>\n<td>Recall@k·출처 충실도·오류 분석</td>\n</tr>\n<tr>\n<td>에이전트 개발이 과도하다</td>\n<td>검색 + 출처 링크 + 사람이 읽는 요약만</td>\n<td>RAG와 일반 검색의 비교</td>\n</tr>\n<tr>\n<td>2027년 희망 과목이 열리지 않는다</td>\n<td>기초·대체 과목부터 듣고 교수와 연구주제 조정</td>\n<td>학점 요건 내 실제 개설과목 활용</td>\n</tr>\n<tr>\n<td>주간·토요일 강의가 근무와 충돌한다</td>\n<td>수강조합·휴가·공식 출석정책부터 재검토</td>\n<td>2년 계획은 유지하되 선택 과목 조정</td>\n</tr>\n<tr>\n<td>AI가 기존 검색보다 낫지 않다</td>\n<td>과도한 도입 주장을 중단</td>\n<td>효과 없음이라는 실험 결과 + 개선된 문서화 방식</td>\n</tr>\n<tr>\n<td>지도교수가 WMS 자체 전문가는 아니다</td>\n<td>정보검색·SW 유지보수·운영관리 질문으로 일반화</td>\n<td>지도 가능한 학술 질문에 맞춘 연구</td>\n</tr>\n<tr>\n<td>학위청구방법에 제한이 있다</td>\n<td>학교·학과 규정에 맞는 경로로 변경</td>\n<td>지도교수와 일정 재설계</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>오히려 가장 위험한 시나리오</strong>는 '어떻게든 군 데이터를 가져오면 될 것'이라는 낙관이나 'AI만 붙이면 해결'이라는 기술 낙관이다. 성실한 연구계획에는 달성 목표뿐 아니라 <strong>어디에서 멈출지</strong>가 들어 있어야 한다.</p>\n<h2 id=\"chapter-08\">08. 돈·행정·이동: 실무자가 반드시 확인할 숫자</h2>\n<h3 id=\"sub-35-638732\">8-1. 등록금은 '2026 기준'과 '내가 낼 돈'을 구분한다</h3>\n<p>이전 조사에서는 2026년 일반대학원 공학계열 학기 수업료 <strong>7,643,000원</strong>, 별도 입학금 <strong>996,000원</strong>, 군무원 20% 수업료 감면 및 교육부장관 취학추천의 50% 감면을 확인했다고 기록돼 있다. 그러나 <strong>2027년 확정 금액과 50% 장학의 실제 연속 적용 요건은 이 보고서에서 별도로 검증되지 않았다.</strong> 아래는 입력값이 그대로라고 가정한 단순 시나리오다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 P47\">P47</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S01\">S01</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S05\">S05</a></sup></p>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>가정(수업료 기준)</th>\n<th style=\"text-align:right\">학기 1회</th>\n<th style=\"text-align:right\">4학기 합계</th>\n<th>비고</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>감면 없음</td>\n<td style=\"text-align:right\">7,643,000원</td>\n<td style=\"text-align:right\">30,572,000원</td>\n<td>2026 값 고정 가정</td>\n</tr>\n<tr>\n<td>20% 감면</td>\n<td style=\"text-align:right\">6,114,400원</td>\n<td style=\"text-align:right\">24,457,600원</td>\n<td>군무원 일반 감면 가정</td>\n</tr>\n<tr>\n<td>50% 감면</td>\n<td style=\"text-align:right\">3,821,500원</td>\n<td style=\"text-align:right\">15,286,000원</td>\n<td>추천·자격·기간 충족 가정</td>\n</tr>\n<tr>\n<td>첫 입학금</td>\n<td style=\"text-align:right\">별도 996,000원</td>\n<td style=\"text-align:right\">996,000원</td>\n<td>수업료 4학기 합계에 미포함</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>50% 가정의 수업료 + 첫 입학금 합계 = 16,282,000원.</strong> 여기에 교재·교통·학회·기자재·기타 경비는 포함하지 않았다. 학비와 시간 모두 <strong>장학 유지가 보장되지 않을 때도 감당 가능한지</strong> 검토해야 한다.</p>\n<h3 id=\"sub-22-563232\">8-2. 취학추천과 전형은 단계가 다르다</h3>\n<p>2027년 공식 모집 공고는 <strong>일반전형(군위탁전형 아님)</strong>과 <strong>군위탁전형(정원외)</strong>을 분리한다. 군위탁전형은 교육부장관 취학추천을 받은 현역군인·군무원을 대상으로 안내한다. 군 내부 승인과 교육부 추천, 학교 명단 반영, 원서의 전형구분, 서류 도착 여부, 장학 심사는 <strong>같은 단계가 아니다</strong>. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S01\">S01</a></sup></p>\n<p>이전 47개 항목에는 한 차례 취소 후 재도전하는 과정과 '최종 미확정'이라는 문구가 함께 담겨 있고, 그 뒤 개인적으로 진행된 내부 승인 내용까지 시점별로 달라질 수 있다. 따라서 이 페이지는 <strong>추천의 현재 최종 상태를 확정하지 않는다.</strong> 실제 면접 전에는 학교에 정확한 전형 반영과 서류 도착을 직접 확인해야 한다. '매 학기 취학추천을 재발급해야 50% 감면을 받는가'도 질문으로 남아 있다.</p>\n<h3 id=\"sub-21-157219\">8-3. 날짜는 면접 전후로 나눠 본다</h3>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>날짜</th>\n<th>확인한 내용</th>\n<th>상태</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026.09.30~10.14</td>\n<td>2027 전기 대학원 인터넷 원서 접수</td>\n<td>공식 모집 공고 <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S01\">S01</a></sup></td>\n</tr>\n<tr>\n<td>2026.11.05(목) 예정</td>\n<td>세종캠퍼스 구술면접 세부 사항 공지</td>\n<td>학교 공식 공고의 <strong>예정</strong> 날짜 <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S01\">S01</a></sup></td>\n</tr>\n<tr>\n<td><strong>2026.11.07(토)</strong></td>\n<td>세종캠퍼스 대면 구술면접</td>\n<td>공식 날짜. <strong>시각은 최종 공지 재확인</strong> <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S01\">S01</a></sup></td>\n</tr>\n<tr>\n<td>2026.12.07(월) 18시 예정</td>\n<td>합격 발표</td>\n<td>공식 예정 <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S01\">S01</a></sup></td>\n</tr>\n<tr>\n<td>2027.03</td>\n<td>입학·수강 시작을 가정</td>\n<td>합격·등록 후 성립하는 시나리오</td>\n</tr>\n<tr>\n<td>2029.02</td>\n<td>4학기 학위취득 목표</td>\n<td>학위요건·연구·승인 충족 시 가능</td>\n</tr>\n</tbody>\n</table></div>\n<p>과거 조사 원문에 11월 7일 <strong>10시부터</strong>라는 기재가 있었지만, 공식 웹 모집공지에서 확인되는 것은 <strong>11월 7일이라는 날짜</strong>와 세부 공지 예정일이다. 시간은 수험표와 최종 안내에서 다시 확인한다. 과거 기록과 최신 공식안내가 다르면 최신 공고가 우선이다.</p>\n<h2 id=\"chapter-09\">09. 그럼 왜 하필 홍익대 국방AI융합학과인가</h2>\n<p>일반적인 AI 대학원은 모델과 알고리즘 자체를 깊게 파는 데 장점이 있다. 하지만 네 질문은 <strong>코드의 오류만도 아니고, 군수정책만도 아니다.</strong> 어떤 정보가 먼저 필요하고, 누구의 판단이 필요한지, 도구가 있어도 사람이 마지막 검증을 어떻게 할지의 문제다. 홍익대 학과는 AI 활용·국방 운영·경영을 함께 다룬다는 점에서 이 경계를 연구하기 좋은 구조다. 이건 <strong>학과의 교육방향과 네 연구질문 사이의 적합성에 대한 판단</strong>이지, 해당 연구를 지도할 교수가 확정됐다는 뜻이 아니다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S04\">S04</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S05\">S05</a></sup></p>\n<p>서울캠퍼스 산업·데이터공학과 수업이나 연구교류는 과거에 검토했던 <strong>보조 선택지</strong>다. 학교 2026년 규정에서 석사 타학과 전공을 총 9학점까지 인정한다고 해도, 실제 서울 수업을 듣게 된다는 보장은 없다. 세종의 소속 학과와 지도교수 중심으로 학업을 안정시킨 뒤 <strong>필요하면 0~1과목 검토</strong>하는 편이 현실적이다. GPU·연구실을 서울캠 학생처럼 자유롭게 쓸 수 있다는 약속도 하지 않는다. <sup><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 S02\">S02</a><a class=\"cite-token\" href=\"#facts\" data-page=\"facts\" title=\"출처 P47\">P47</a></sup></p>\n<h3 id=\"sub-18-879018\">교수의 시선으로 본 세 가지 경고</h3>\n<p><strong>① “이미 AI를 잘 쓴다”는 자기소개는 오히려 얕아 보일 수 있다.</strong> 실무 AI 활용경험은 장점이지만, 학생으로서 배워야 할 검증·연구방법을 분명히 말해야 한다.</p>\n<p><strong>② 연구제목에 '에이전틱'을 너무 앞세우면 개발 범위가 커 보인다.</strong> 먼저 RAG/검색 비교의 유효성을 검증하고, 도구 호출 자동화는 후속 범위로 둔다.</p>\n<p><strong>③ 학업과 근무 병행을 쉽게 말하면 준비가 덜 된 인상을 준다.</strong> 2026 실제 시간표와 2026 학점/시험 규정을 구분해 확인했다는 사실을 보여주는 편이 강하다.</p>\n<h2 id=\"chapter-10\">10. 네 가지 면접 답변은 보고서의 '요약 결론'이다</h2>\n<p>이 질문들은 프로젝트의 중심이 아니라 <strong>위 현실검토가 정확히 이해됐는지를 구술로 확인하는 마지막 관문</strong>이다. 외울 문장을 지나치게 길게 만들지 않고 핵심 구조를 유지한다.</p>\n<h3 id=\"sub-40-350649\">1. 자기소개와 지원동기 — “문제 하나가 시스템 여러 층으로 이어졌다”</h3>\n<p>현재 군에서 전산직 군무원으로 근무하며 물류정보체계와 창고관리시스템을 운영·유지보수하고 있습니다. 이 과정에서 화면, 서버 프로그램, 데이터베이스, 자동화설비가 서로 연결된 문제를 자주 다뤘습니다. 바코드 인식 문제나 화면 조회 항목을 수정하면서, 같은 장애라도 담당자가 체계 전체의 관계를 알아야 해결할 수 있다는 점을 느꼈습니다. 특히 신규 담당자는 필요한 자료를 찾는 데 시간이 많이 걸리고 숙련자의 경험에 의존하게 됩니다. 단순히 그때그때 장애를 해결하는 것에서 나아가 이런 진입장벽을 체계적으로 분석하고 싶었습니다. AI와 데이터 분석뿐 아니라 국방 운영과 공급사슬관리까지 함께 배울 수 있는 홍익대 국방AI융합학과에 지원한 이유입니다.</p>\n<p><strong>면접관이 붙잡을 부분:</strong> 실제 수정했던 한 사례, 왜 문제의 원인을 찾기 어려웠는지, 'AI'가 아니라 <strong>공유되지 않는 지식</strong>이 왜 핵심 문제인지.</p>\n<h3 id=\"sub-35-338378\">2. 입학 후 계획 — “처음엔 배우고, 다음엔 작게 검증한다”</h3>\n<p>입학 후에는 데이터 분석과 AI의 기본 원리, 결과 검증 방법, 정보보호를 먼저 배우겠습니다. 실무에서 생성형 AI로 코드를 해석하거나 SQL 초안을 만든 경험은 있지만, 모델의 답이 왜 맞는지 확인하는 능력은 더 필요하다고 느꼈습니다. 이후 공급사슬관리와 의사결정 관련 학습을 통해 WMS를 물류 운영 전체에서 보겠습니다. 연구는 신규 담당자가 코드·DB·로그·장애기록을 찾는 과정을 좁은 과제로 정하고, 독립적으로 만든 모사 데이터에서 기존 검색 방식과 RAG 보조방식을 비교하는 방향을 생각하고 있습니다. 실제 과목 개설과 연구 범위는 지도교수와 협의해 조정하겠습니다.</p>\n<p><strong>면접관이 붙잡을 부분:</strong> 지도교수 상담, 실제 데이터 반출 금지, RAG와 에이전트의 차이, 실험 가능한 평가 기준.</p>\n<h3 id=\"sub-30-198906\">3. 졸업 후 포부 — “AI보다 먼저 지식을 남긴다”</h3>\n<p>졸업 후에는 연구 결과를 인수인계와 장애 대응절차 개선에 활용하고 싶습니다. 현재는 오래된 체계의 구조와 과거 조치 경험이 숙련자의 머릿속에 많이 남아 있어 담당자가 바뀌면 비슷한 문제를 다시 추적하기 쉽습니다. 그래서 관련 코드와 데이터 구조, 장애이력, 확인 순서를 체계적으로 정리하는 것이 첫 목표입니다. 근거를 제시하는 AI 보조방식이 실제 탐색시간과 정확도 개선에 도움이 된다는 결과가 나올 때에만, 보안 검토와 승인 아래 단계적인 활용을 검토하겠습니다. 특정 AI 모델을 도입하는 것보다 담당자가 바뀌어도 안정적으로 운영할 수 있는 업무방식을 남기고 싶습니다.</p>\n<p><strong>면접관이 붙잡을 부분:</strong> 조직이 받는 이익, 연구가 기대만큼 성공하지 않을 때의 대안, 졸업과 실제 배포의 차이.</p>\n<h3 id=\"sub-41-551065\">4. 야간수업 가능 여부 — “과거 시간표와 2027 실제 편성은 다르다”</h3>\n<p>현재 세종에서 근무하고 거주해 세종캠퍼스와의 접근성이 좋습니다. 지원 전에 실제 시간표를 확인했고 평일 저녁 시간에 운영되는 과목이 여러 개 있었습니다. 그래서 근무 후 수업을 병행하는 계획을 세울 수 있다고 생각합니다. 다만 행정상 주간 과정이고 일부 낮 시간이나 토요일 수업도 있을 수 있어 모든 수업이 야간·온라인이라고 생각하지는 않습니다. 실제 수강신청 때 강의방식과 학점·출석 요건을 확인하고, 주간 대면수업이나 지도 면담이 필요한 경우 소속기관의 정해진 절차에 따라 미리 일정을 조정하겠습니다. 야근·출장과 충돌할 때도 정식 학사 절차와 업무 협업을 통해 대응하겠습니다.</p>\n<p><strong>면접관이 붙잡을 부분:</strong> '수업 가능'을 말할 객관적 근거, 주간 과목 충돌 대응, 9학점 강의시간 외의 과제·연구시간.</p>\n<p><strong>네 문항의 가장 짧은 연결:</strong> <strong>현장의 병목을 발견했다 → 기본기를 보완한다 → 작게 검증한다 → 조직이 재사용할 결과를 남긴다.</strong> 이 순서가 흔들리지 않으면 꼬리질문을 받아도 논리가 유지된다.</p>\n<h2 id=\"chapter-11\">11. 입학 확정 전 확인해야 할 열린 질문</h2>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>우선순위</th>\n<th>확인할 대상</th>\n<th>확인 질문</th>\n<th>이유</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>대학원 교학팀</td>\n<td>군위탁 추천명단이 내 원서 전형에 정확히 반영됐나? 서류 접수 상태는?</td>\n<td>전형 자격과 추천절차는 별개</td>\n</tr>\n<tr>\n<td>2</td>\n<td>대학원 교학팀</td>\n<td>2027년 실제 수업시간·온라인 허용 범위는?</td>\n<td>현실적인 출석 계획의 전제</td>\n</tr>\n<tr>\n<td>3</td>\n<td>학과</td>\n<td>논문·개별연구과제·교과목이수 중 어떤 경로가 가능한가?</td>\n<td>학기별 학점 구조가 달라짐</td>\n</tr>\n<tr>\n<td>4</td>\n<td>학과</td>\n<td>선수과목이 지정되는가? 종합시험·외국어시험 조건은?</td>\n<td>학점만 채워도 졸업 못할 위험</td>\n</tr>\n<tr>\n<td>5</td>\n<td>학과·교수</td>\n<td>실제 지도 가능한 연구 분야와 지도교수 신청 절차는?</td>\n<td>연구주제 현실화</td>\n</tr>\n<tr>\n<td>6</td>\n<td>군 인사·학교</td>\n<td>50% 장학을 매 학기 유지하는 데 추천 재발급이 필요한가?</td>\n<td>재정계획 불확실성</td>\n</tr>\n<tr>\n<td>7</td>\n<td>소속기관 보안 담당</td>\n<td>실무 기록의 학술 활용이 어디까지 승인되는가?</td>\n<td>독립 모사 데이터와 실제 자료 경계</td>\n</tr>\n<tr>\n<td>8</td>\n<td>대학원 학사 담당</td>\n<td>서울 타과 수강의 신청·인정·출석 조건은?</td>\n<td>보조 학습 선택지의 실제 가능성</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>판단 기준:</strong> 위 질문 가운데 (2) 강의 시간표와 (3) 학위청구 경로, (7) 실험 데이터 경계가 해결되기 전에는 '2년 안에 운영체계용 에이전트를 만들겠다'는 구체적 약속을 하지 않는 편이 타당하다.</p>\n<h2 id=\"sources\">12. 출처와 검증 범위</h2>\n<p>여기의 자료는 <strong>① 제출 수학계획서 원문(P01) ② 과거 조사 47개 항목 원문(P47) ③ 2026년 10월 31일 현재 공개 확인 가능한 학교 공식자료(S) ④ 연구방법 참고자료(R)</strong>를 구분한다. 과거 원문은 그 당시 회수된 판단과 상황을 보존하기 위한 <strong>기록</strong>이지 현재 공식 고시로 대체되지 않는다.</p>\n<div class=\"table-wrapper\"><table>\n<thead>\n<tr>\n<th>코드</th>\n<th>자료</th>\n<th>근거 수준 / 사용하는 범위</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>P01</strong></td>\n<td>이 대화에서 제공한 홍익대 수학계획서 4개 장</td>\n<td>지원자 직접 제공 원문. 표현은 변경하지 않고 부록 수록</td>\n</tr>\n<tr>\n<td><strong>P47</strong></td>\n<td>이전 조사 47개 항목의 종합 기록</td>\n<td>사용자가 제공한 과거 연구·행정상태. 현재 확인과 구별</td>\n</tr>\n<tr>\n<td><strong>S01</strong></td>\n<td><a href=\"https://www.hongik.ac.kr/kr/admission/notice-military.do?article.offset=0&amp;articleLimit=10&amp;articleNo=157298&amp;mode=view\">홍익대 2027 전기 군위탁 포함 모집 공고</a> · 2026.09.18</td>\n<td>전형구분, 원서기간, 11/07 세종 면접, 12/07 발표, 상세공지 예정일</td>\n</tr>\n<tr>\n<td><strong>S02</strong></td>\n<td><a href=\"https://www.hongik.ac.kr/kr/newscenter/notice.do?articleNo=147598&amp;mode=view\">홍익대 2026-1 대학원 수강신청 공지</a></td>\n<td>수업원칙, 군위탁 비대면 예외, 학점·타과수강·학위발표·선수과목 규정의 <strong>2026 사례</strong></td>\n</tr>\n<tr>\n<td><strong>S03</strong></td>\n<td><a href=\"https://grad00.hongik.ac.kr/common_pdf/guide06_06.pdf\">홍익대 석사 학위청구방법·시험 안내 PDF</a></td>\n<td>24/30학점, 종합시험·외국어시험·학위청구 신청 절차. 학과별 예외 확인 필요</td>\n</tr>\n<tr>\n<td><strong>S04</strong></td>\n<td><a href=\"https://www.hongik.ac.kr/kr/newscenter/news.do?article.offset=0&amp;articleLimit=12&amp;articleNo=134371&amp;mode=view\">홍익대 국방AI융합학과 신설 소식</a> · 2025.04.09</td>\n<td>학과 신설과 교육목표</td>\n</tr>\n<tr>\n<td><strong>S05</strong></td>\n<td><a href=\"https://kookbang.dema.mil.kr/newsWeb/m/20251209/1/ATCE_CTGR_0010010000/view.do\">국방일보 학교·학과 소개</a> · 2025.12.08</td>\n<td>융합영역, Webex·야간 운영 <strong>소개사례</strong>, 50% 감면 안내</td>\n</tr>\n<tr>\n<td><strong>S06</strong></td>\n<td><a href=\"https://gbai.hongik.ac.kr/gbai/0401.do\">학과 교육과정 공식 페이지</a></td>\n<td>과목을 확인할 공식 경로. 동적 목록은 웹 수집에서 최신 과목명 전체 확인 제한</td>\n</tr>\n<tr>\n<td><strong>S07</strong></td>\n<td><a href=\"https://gbai.hongik.ac.kr/gbai/0301.do?articleNo=156353&amp;mode=view\">학과 대학 AI 활용 윤리 가이드라인</a> · 2026.09.04</td>\n<td>대학 AI 사용 윤리 준수 참고</td>\n</tr>\n<tr>\n<td><strong>R01</strong></td>\n<td><a href=\"https://arxiv.org/abs/2005.11401\">Lewis et al., Retrieval-Augmented Generation</a> · 2020</td>\n<td>RAG의 원형 연구 소개</td>\n</tr>\n<tr>\n<td><strong>R02</strong></td>\n<td><a href=\"https://arxiv.org/abs/2309.15217\">RAGAS: Automated Evaluation of RAG</a> · 2023</td>\n<td>검색·답변·근거 충실도 분리 평가의 선행연구</td>\n</tr>\n<tr>\n<td><strong>R03</strong></td>\n<td><a href=\"https://genai.owasp.org/llm-top-10/\">OWASP Top 10 for LLM Applications 2025</a></td>\n<td>인젝션·민감정보 유출·과도한 권한 등 보안 위험 분류</td>\n</tr>\n<tr>\n<td><strong>R04</strong></td>\n<td><a href=\"https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence\">NIST Generative AI Profile</a> · 2024</td>\n<td>생성형 AI 위험관리·인간 감독 참고 틀</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>검증 한계:</strong> 2027년 등록금과 실제 개설 과목·시간표·해당 교수의 지도 가능 여부는 이 보고서에서 확정하지 못했다. 학위청구 경로 역시 학교 공통 규정의 내용과 <strong>해당 학과 실제 적용</strong>을 혼동하지 않도록 남겨두었다. 완전한 입학·졸업 시뮬레이션이 되려면 이 질문들을 합격 후 반드시 학교에 확인해야 한다.</p>\n","version":"2026-11-01 면접 아틀리에 · 심층조사 통합판","factAudit":[{"topic":"국방AI융합학과","statement":"세종캠퍼스 일반대학원, 2025 신설","status":"확인","ref":"S14"},{"topic":"면접 날짜","statement":"2026.11.07(토)","status":"확인","ref":"S1"},{"topic":"면접 시작시각","statement":"과거 자료의 10:00 표기, 최종 상세공지 필요","status":"미확정","ref":"P47"},{"topic":"세종 실제 저녁 수업","statement":"2026 과거 시간표 19~22시 등의 사용자 기록","status":"이전 기록","ref":"P47"},{"topic":"2027 전과목 야간·온라인","statement":"확정된 근거 없음","status":"미확정","ref":"S4"},{"topic":"학기당 수강학점","statement":"2026 주간 석사 6~9학점 일반 안내","status":"확인","ref":"S4"},{"topic":"논문 4학기 발표","statement":"3학기까지 24학점 취득 기준 검토","status":"부분확인","ref":"S4"},{"topic":"비논문 30학점","statement":"공통 제도 존재, 학과별 허용 미확정","status":"주의","ref":"S12"},{"topic":"지도교수","statement":"1차 학기 신청 사례, 실제 배정 별도","status":"부분확인","ref":"S11"},{"topic":"외국어·종합시험","statement":"졸업 요건과 면제/대체 기준 별도 확인","status":"부분확인","ref":"S10"},{"topic":"타과 수강","statement":"2026 석사 타과 인정 9학점 안내","status":"확인","ref":"S4"},{"topic":"2027 과목 개설","statement":"34개 이전 교과목 기록 ≠ 실제 개설","status":"미확정","ref":"S3"},{"topic":"취학추천","statement":"행정 절차와 대학 전형 반영 구분 필요","status":"미확정","ref":"S1"},{"topic":"수업료 50% 감면 유지","statement":"이전 안내는 있으나 학기별 조건 확인 필요","status":"미확정","ref":"P47"},{"topic":"군 자료 연구 활용","statement":"취학추천과 무관하게 승인 필요","status":"주의","ref":"S13"},{"topic":"RAG 성능","statement":"검색증강 구조이나 환각 방지 보장 아님","status":"확인","ref":"R01"},{"topic":"에이전틱 연구","statement":"읽기전용 도구 선택/순차 호출 확장 가능","status":"부분확인","ref":"R03"},{"topic":"Private GitHub","statement":"군 자료 저장 승인영역이 아님","status":"주의","ref":"R06"},{"topic":"2026 종합시험 구체 자격","statement":"주간 석사 3학기 이상 등록·18학점·선수과목 및 평균 B0 이상 등","status":"확인","ref":"S16"}],"lastMinute":["면접 최종 시각·장소, 수험표·신분증 확인","자기소개→지원동기→연구주제 흐름을 60초에 말하기","바코드 인식 또는 화면 조회 항목 수정 사례 하나 설명","RAG와 일반 LLM·에이전트의 차이를 구별","사람/LLM/RAG 비교조건과 탐색시간·정확도 설명","기술 도입이 아니라 신규 담당자 인수인계 개선에 초점","실제 군 자료는 승인 없이 대학이나 외부 저장소에 옮기지 않기","2027 시간표·비논문 허용은 아직 확정하지 않기","야근·출장·주간대면 일정의 합법적 조정방법 준비","졸업 이후 현장 실배포는 별도 검토·승인 대상임을 기억"],"badPhrases":[["AI로 장애를 자동 해결","읽기전용 근거 탐색과 원인 후보 보조"],["실제 군 로그·코드를 외부 연구에 사용","독립 모사자료 우선, 실자료는 별도 승인"],["전과목 온라인이라 병행 문제없음","이전 저녁 수업 사례 확인, 실제 2027 편성 확인"],["비논문 30학점이면 졸업 확정","학과 실제 학위청구방식 확인 필요"],["RAG를 쓰면 환각이 사라짐","검색·근거충실성·위험 응답을 별도 검증"],["2년 내 운영체계에 도입 확정","작은 비교실험이 목표, 실제 도입은 별도 승인"]],"feasibility":{"checkedAt":"2026-11-01","rows":[{"subject":"학과·진학경로","conclusion":"홍익대 세종캠퍼스 일반대학원 국방AI융합학과가 2025학년도에 신설됐고, 2027학년도 전기 세종 면접은 11월 7일이야.","status":"공식 확인","ref":"S14","basis":"학교 신설 기사와 2027 전기 모집·대학원 입시 일정. 모집공지에는 구체사항 11/5 예정, 학과별 시작시각 11/6 예정이 따로 표시돼 있으며 실제 시각은 별도 공지에 따름.","implication":"지원 배경과 실제 면접일의 객관적 근거는 확보했어."},{"subject":"주간 석사 수강학점","conclusion":"2026학년도 일반대학원 안내상 주간 석사는 한 학기 6~9학점, 4학기부터는 6학점 이하로 신청 가능해.","status":"공식 확인","ref":"S4","basis":"홍익대 2026학년도 1학기 대학원 수강신청 공지의 '학기 당 이수 가능 학점'.","implication":"3학점 과목 기준 9학점이면 강의 세 과목이며, 학교 시간표를 보지 않고 주 2회라고 단정할 수 없어."},{"subject":"4학기 논문 준비","conclusion":"2026 안내는 주간 석사가 24학점을 취득한 다음 학기에 논문을 발표할 수 있다고 명시해. 따라서 4학기 발표 목표라면 3학기 종료까지 24학점이 필요해.","status":"공식 확인","ref":"S4","basis":"같은 공지 '논문/개별연구과제 심사자의 경우 졸업소요학점'.","implication":"9→9→6학점은 조건을 만족하는 수강 예시지만, 실제 학과 개설·전공요건 충족은 별도로 계산해야 해."},{"subject":"종합시험·선수과목","conclusion":"학교의 공통 안내에 따르면 석사 종합시험은 3학기 이상 등록·전공필수 포함 18학점 이상이 기준이고, 전공이 다르면 선수과목 이수와 평균 B0 이상 조건이 붙어.","status":"공식 확인","ref":"S10","basis":"2026 대학원 종합시험 공지와 학교 '졸업자격시험' 페이지. 2과목 시험 안내 포함.","implication":"4학기 논문 목표라면 시험을 3학기 무렵부터 역산해서 준비하는 게 합리적이야."},{"subject":"외국어시험","conclusion":"일반대학원 석사는 영어 또는 학과가 허용한 추가 과목 중 1과목을 응시하고, 일정 수준의 공인 성적으로 면제받을 수 있어.","status":"공식 확인","ref":"S10","basis":"학교 졸업자격시험: 예컨대 TOEIC 700, TEPS 340, TOEFL iBT 71, OPIc IM3 등의 대체 기준이 명시됨.","implication":"시험 또는 성적 대체 중 하나를 일찍 결정하면 졸업학기 준비 부담을 줄일 수 있어."},{"subject":"지도교수 신청","conclusion":"2026년 학교 공지는 1차 학기 이상 재학생의 논문지도교수 신청을 허용하고, 사전 면담 및 구두 허가 뒤 클래스넷 신청을 안내해.","status":"공식 확인","ref":"S11","basis":"2026.02.25 지도교수 신청 공지. 실제 교수 배정·수락 여부는 별개의 개인 절차.","implication":"1학기부터 상담을 시도하는 계획은 제도상 가능하지만, 특정 지도교수를 이미 확보한 것은 아니야."},{"subject":"학위청구 경로","conclusion":"일반대학원에는 논문·개별연구과제·교과목이수 관련 안내가 있으나, 국방AI융합학과에서 실제 허용하는 방식을 공개 자료만으로 확정할 수 없어.","status":"학과별 미확정","ref":"S12","basis":"2026 학위청구방법 신청 공지와 학과별 선택 제한. 단순히 '30학점이면 비논문 졸업'이라고 단정하면 안 됨.","implication":"논문 24학점을 기본 가정으로 계획하고 다른 경로는 학과 확인 후만 대안으로 계산해야 해."},{"subject":"수업의 대면·온라인 운영","conclusion":"학교 2026 수강안내는 대면수업을 원칙으로 하면서 군위탁 학생 등에 비대면을 허용하는 예외를 명시했어.","status":"공식 확인","ref":"S4","basis":"비대면 '허용'은 개인이 모든 과목을 원격으로 들을 권리나 해당 학과의 전과목 온라인 보장이 아님.","implication":"직장 병행은 가능성을 뒷받침하지만, 대면 출석·세미나·시험을 감안해야 해."},{"subject":"지난 2026 실제 강의시간","conclusion":"기존 사용자 조사에는 평일 19~22시가 많고, 18~21시·16~19시와 토요일 10~13시 사례도 기록돼 있어.","status":"사용자 제공 기록","ref":"P47","basis":"사용자가 이전에 직접 확인한 시간표에 대한 대화 기록. 이번 조사에서 동일 화면의 최신 시간표를 독립 확보하지는 못했어.","implication":"평일 저녁 수강 가능성의 근거는 되지만 2027년 실제 개설을 보증하지는 않아."},{"subject":"2027 시간표·개설과목","conclusion":"2027학년도 학기별 실제 강의요일·시간·교수별 출석방식은 현재 공개 자료에서 확정하지 못했어.","status":"현재 확인 불가","ref":"S3","basis":"학교는 학기별 클래스넷 시간표와 강의계획서를 별도로 제공함. 교과과정의 과목 목록과 실제 개설은 다름.","implication":"'반드시 주 2회 야간 수업'이라는 주장을 버리고, 3일 출석 또는 일부 주간 대면 일정도 가능한 시나리오로 설정했어."},{"subject":"군위탁 장학제도","conclusion":"홍익대 장학 안내는 일반 군인·군무원 재직자 수업료 20%, 학군협약에 따른 교육부장관 추천 등 요건을 충족하는 군인·군무원 50%를 별도로 명시해.","status":"공식 확인","ref":"F-SCH","basis":"홍익대 대학원 장학금안내 '현역군인장학금'. 50%는 자격 충족 시 제도상 수치이며 4학기 무조건 지급 확약은 아님.","implication":"현실적 예산은 50% 적용과 미적용 두 경우를 모두 고려해야 해."},{"subject":"장학 신청서류·유지조건","conclusion":"학교 장학 신청방법에는 군 관련 장학금 신청 시 신청서와 복무 확인서를 안내해. 다만 군 내부의 취학추천 재발급과 장학금 갱신이 동일한 절차인지는 확정하지 못했어.","status":"부분 확인","ref":"F-SCHA","basis":"홍익대 대학원 장학금신청방법. 신청시기와 제출서류 제시, 개인의 실제 적용·갱신은 미공개 행정자료.","implication":"등록 전 학교와 군 행정기록의 반영상태를 대조해야 하는 이유가 명확해졌어."},{"subject":"등록금의 실제 금액","conclusion":"학교 공식 FAQ에는 '2026학년도 한 학기 기준 등록금표'가 있지만 표가 이미지로 제시돼 이번 텍스트 검증으로 계열별 금액을 확정하지 못했어.","status":"금액 검증 제한","ref":"F-TUITION","basis":"이전 조사에서 수업료 7,643,000원·입학금 996,000원을 기록했으나, 정확한 계열별 수업료와 2027 고지액을 이 조회에서 독립 검증하지 못함.","implication":"이전 숫자로 50% 적용 시나리오를 계산할 수는 있지만 2027 확정 학비로 표시하면 안 돼."},{"subject":"근무와 학업의 주간 시간","conclusion":"9학점을 3학점×3과목·과목당 주 3시간 강의로 가정하면 주 9시간 강의가 발생해. 복습·과제·연구에 추가 주 6~9시간을 잡으면 총 15~18시간 수준이야.","status":"모형 계산·가정","ref":"S4","basis":"일반적인 3학점·3시간 강의 기준과 자율학습 시간을 결합한 계획안. 실제 강의 시수·과제량이 학교에서 확정된 것은 아님.","implication":"근무 종료 후 매주 15~18시간을 안정적으로 확보해야 하므로 무조건 쉽다고 답변하면 부정확해."},{"subject":"연구 데이터·보안","conclusion":"군 취학추천은 대학원 입학 관련 절차이며 실제 군 WMS 코드·로그·스키마 반출 허가는 아니야. 연구는 독립적인 가상 WMS로 시작해야 해.","status":"보수적 보안설계","ref":"F-SEC","basis":"자료 사용의 정확한 내부 규정·개별 승인은 공개 웹에서 확인할 수 없음. 실운영 식별정보를 비공개 GitHub에도 올리지 않음.","implication":"연구 초기 성과물은 가상 코드·로그·DB 관계명세와 10~20개 시험 과제로 제한하는 편이 현실적이야."},{"subject":"RAG 연구의 석사 범위","conclusion":"코드·SQL·로그의 관계를 찾는 검색 지원을 연구 질문으로 좁히고, 수동 검색/LLM 보조/RAG의 관련자료 적중률·소요시간·근거충실성을 비교할 수 있어.","status":"연구 설계 제안","ref":"R01","basis":"RAG 선행연구는 검색-생성 구조의 가능성을 제시하지만 특정 WMS 유지보수에서 성능 개선을 입증하지는 않아.","implication":"성능 개선이 없더라도 오류·적용 한계를 결과로 남기면 연구의 의미가 있어."}],"scenarios":[{"name":"기준안 · 4학기 논문 목표","badge":"조건부 현실적","why":"2026 안내의 주간 석사 논문 발표요건과 학점 범위를 기준으로 9→9→6학점을 3학기까지 채우고, 4학기는 논문 마무리에 집중한다.","limit":"3학기까지 24학점과 졸업시험·논문 심사 준비를 완료해야 하며, 2027 실제 개설과 지도교수 지도가 따라야 한다."},{"name":"업무 충돌형 · 수강조합 조정","badge":"충돌 대비","why":"주간 대면·야근·출장이 겹치면 과목을 재조합하고 공식 근무·휴가 절차를 활용하며 한 학기 연구범위를 줄인다.","limit":"학점 수강을 늦추면 4학기 논문 발표 또는 졸업도 연기될 수 있다. 온라인 일괄 대체는 보장되지 않는다."},{"name":"연구 제약형 · 모사 데이터 축소","badge":"보안 우선","why":"실무자료가 연구 활용 불가하면 처음부터 독립 가상 코드·DB·로그에 한정하고, 사람 대상 평가가 어렵다면 정답기반 오프라인 평가로 전환한다.","limit":"실제 군 현장으로 일반화할 수 있는 정도는 제한적이며, 운영체계 직접 도입을 성과로 약속하지 않는다."}],"unanswered":[["2027 강의시간·교수별 출석방식","2027년 학기별 실제 개설 시간표가 아직 공개·확정되지 않아 공개 웹으로 판단 불가","학과의 추후 강의계획서·클래스넷"],["군위탁 추천명단 반영/학적","개인 원서와 내부·교육부 추천명단은 보호된 행정정보라 공개 검색으로 판정 불가","학교 지원자 기록 및 해당 기관 행정기록"],["군위탁 장학 계속 적용","공식 50% 제도는 있지만 개인 자격과 학기별 갱신·재추천 사실은 공개 웹에 없음","학교 장학 심사 결과 및 소속기관 처리기록"],["국방AI융합학과 학위청구 허용방식","학교 공통 제도와 소속 학과가 실제 선택 가능한 경로는 서로 다른 판단","학과 졸업방법 적용표/지도교수 승인"],["연구에 쓸 내부 자료의 승인","학교 취학추천과 군 자료활용 승인절차는 구분되며 공개 자료로 개인 권한 파악 불가","소속기관 보안심사 결과"]]}};

<script>
(()=>{
'use strict';
const D=window.HONGIK_DATA, root=document.getElementById('content');
if(!D||!root){document.body.innerHTML='<p>필수 콘텐츠 파일(data/content.js)을 찾을 수 없어. 폴더 구조를 유지해줘.</p>';return}
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const state={page:'home',duration:'short',followFilter:'전체',qSearch:'',archiveTab:'plan',factFilter:'전체',timer:null,timerStart:null,elapsed:0,activeScript:null,showScript:true,focus:false};
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saved=(()=>{try{return JSON.parse(localStorage.getItem('hongik-study-v2')||'{}')}catch{return{}}})();
function persist(){try{localStorage.setItem('hongik-study-v2',JSON.stringify(saved))}catch{}}
function checked(k){return !!saved[k]}
function setcheck(k,v){saved[k]=v;persist()}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('visible');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('visible'),2600)}
function title(k,t,d,meta=''){return `<header class="page-intro"><div class="section-eyebrow">${k}</div><h1>${t}</h1><p>${d}</p>${meta?`<div class="intro-meta">${meta}</div>`:''}</header>`}
function section(t,right=''){return `<div class="section-heading"><h2>${t}</h2><span>${right}</span></div>`}
function pill(t,cls=''){return `<span class="pill ${cls}">${escape(t)}</span>`}
function btn(text,action,cls=''){return `<button class="btn ${cls}" data-action="${escape(action)}">${text}</button>`}
function check(key,text){return `<label class="check-row"><input type="checkbox" data-check="${escape(key)}" ${checked(key)?'checked':''}><span>${escape(text)}</span></label>`}
function getProgress(prefix,total){let n=Object.keys(saved).filter(k=>k.startsWith(prefix)&&saved[k]).length;return [Math.min(n,total),total]}
function progress(n,max){return `<div class="progress-track"><div style="width:${max?100*n/max:0}%"></div></div><div class="progress-meta">${n} / ${max} 완료 · 이 브라우저에 저장됨</div>`}
function openSearch(){const modal=$('#searchModal');modal.hidden=false;$('#overlay').hidden=false;$('#globalSearch').value='';search('');setTimeout(()=>$('#globalSearch').focus(),30)}
function closeSearch(){const modal=$('#searchModal');modal.hidden=true;$('#overlay').hidden=true}
function nav(page,hash=true){stopMock();if(!pages[page])page='home';state.page=page;clearTimer();render();if(hash)history.replaceState(null,'','#'+page);window.scrollTo({top:0,behavior:'instant'});$('#sidebar').classList.remove('mobile-open');$('#overlay').classList.remove('menu-backdrop');$('#overlay').hidden=true;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#breadcrumbCurrent').textContent=pages[page].tag;}

state.mockPool='전체';state.mockId='core-motivation';state.mockReveal=false;state.mockSeconds=0;state.mockInterval=null;
function stopMock(){if(state.mockInterval){clearInterval(state.mockInterval);state.mockInterval=null}}
function bank(){return [...D.scripts.map(s=>({id:'core-'+s.id,type:'핵심 4문항',q:s.title,a:s.short,tip:s.tip,risk:s.risk})),...D.followups.map((s,i)=>({id:'follow-'+i,type:s.tag,q:s.question,a:s.answer,tip:'핵심부터 먼저 답하고 확인된 근거로 뒷받침해.',risk:'미확인 사항이나 군 내부 정보를 단정하지 말기.'}))]}
function filteredBank(){const items=bank();if(state.mockPool==='핵심 4문항')return items.filter(x=>x.id.startsWith('core-'));if(state.mockPool==='꼬리질문')return items.filter(x=>x.id.startsWith('follow-'));if(state.mockPool==='약점만')return items.filter(x=>saved['confidence-'+x.id]&&Number(saved['confidence-'+x.id])<=2);return items}
function nextMock(){stopMock();state.mockSeconds=0;const p=filteredBank();const options=p.filter(x=>x.id!==state.mockId);state.mockId=(options.length?options:p)[Math.floor(Math.random()*(options.length||p.length))]?.id||'';state.mockReveal=false;render()}
function formatMockTime(){let n=state.mockSeconds;const el=$('#mockClock');if(el){el.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');el.style.color=n>90?'#f2aaa0':n>60?'#f1c988':'#cceca7'}}
function mock(){const pool=filteredBank();const q=pool.find(x=>x.id===state.mockId)||pool[0];const completed=bank().filter(x=>saved['confidence-'+x.id]).length;return title('09 / MOCK INTERVIEW','실전 모의면접','답변을 보기 전에 실제로 말하고, 타이머를 확인한 다음 자기평가를 기록해. 1·2점은 약점만 모드에서 다시 출제돼.',pill('무작위 출제')+pill('답변 숨김')+pill('자신감 1~5'))
+'<div class="atelier-launch"><div><strong>연습한 질문 '+completed+' / '+bank().length+'개</strong><p>학습 상태는 이 브라우저에만 저장되며 다른 기기로 동기화되지 않아.</p></div>'+btn('면접 직전 한 장 →','go:briefing','tiny')+'</div>'
+'<div class="question-tools"><div class="chips">'+['전체','핵심 4문항','꼬리질문','약점만'].map(t=>'<button class="filter-chip '+(state.mockPool===t?'active':'')+'" data-mock-pool="'+escape(t)+'">'+escape(t)+'</button>').join('')+'</div></div>'
+(q?'<section class="mock-card"><div class="mock-head"><span>'+escape(q.type)+' / '+pool.length+'문항</span><span class="mock-time" id="mockClock">'+String(Math.floor(state.mockSeconds/60)).padStart(2,'0')+':'+String(state.mockSeconds%60).padStart(2,'0')+'</span></div><h2>'+escape(q.q)+'</h2><div class="mock-controls"><button class="primary" data-action="mockTimer">'+(state.mockInterval?'■ 일시정지':'▶ 말하기 시작')+'</button><button data-action="mockReset">↺ 타이머 초기화</button><button data-action="mockReveal">'+(state.mockReveal?'답변 숨기기':'답변 확인하기')+'</button><button class="primary" data-action="mockNext">다음 무작위 질문 →</button></div></section>'
+(state.mockReveal?'<div class="mock-answer"><div class="overline">EXPECTED DIRECTION / 답변 비교</div><p>'+escape(q.a)+'</p><div class="note-row"><div class="note-box"><b>핵심</b>'+escape(q.tip)+'</div><div class="note-box warn"><b>피할 표현</b>'+escape(q.risk)+'</div></div></div>':'<div class="callout navy">답변은 가려져 있어. 먼저 직접 말한 뒤 <b>답변 확인하기</b>를 눌러 대조해.</div>')
+'<div class="card"><h3>방금 답변은 어땠어?</h3><p>정확성·논리·근거·속도를 함께 판단해. 약했던 질문은 다시 나와.</p><div class="mock-ratings">'+['전혀 모름','어려움','보통','괜찮음','자신'].map((x,i)=>'<button data-confidence="'+(i+1)+'" data-confidence-id="'+q.id+'" class="'+(Number(saved['confidence-'+q.id])===i+1?'active':'')+'">'+(i+1)+' · '+x+'</button>').join('')+'</div></div>'
:'<div class="card"><h3>약점으로 표시된 질문이 아직 없어.</h3>'+btn('전체 질문으로 돌아가기','mockAll','primary')+'</div>')+'<div class="callout warn">이 답변은 유일한 정답이 아니라 연습 기준이야. 교수의 질문을 들은 뒤 실제 경험과 확인된 사실만 선택해서 말하는 게 중요해.</div>';}
function briefing(){const count=D.lastMinute.filter((x,i)=>checked('last-'+i)).length;return title('10 / LAST-MINUTE','면접 직전 한 장','시험장 앞에서는 새로운 내용을 늘리지 말고, 네 실무 경험에서 출발한 이야기의 연결만 확인해.',pill('30초 핵심 4문항')+pill('위험 표현')+pill('준비 체크'))
+'<div class="card dark big"><div class="overline">ONE NARRATIVE</div><h2 style="color:#eef9e6;line-height:1.6">현장의 진입장벽 발견 → AI·데이터 검증 학습 → 읽기전용 RAG 비교실험 → 인수인계 개선으로 환류</h2><p>단순히 AI가 좋다는 말이 아니라, 신규 담당자의 원인 탐색이 얼마나 개선되는지 직접 검증한다.</p></div>'

+'<div class="brief-grid">'+D.scripts.map(s=>'<article class="brief-card"><div class="overline">'+escape(s.no)+' / '+escape(s.eng)+'</div><h3>'+escape(s.title)+'</h3><p>'+escape(s.micro)+'</p></article>').join('')+'</div>'

+'<div class="callout warn"><strong>중요.</strong> 아래 보고서는 검토에 사용한 기존 자료를 통합한 것으로, 과거 금액·시간표·전형상태·학과별 비논문 허용 여부는 최종 확정사실이 아닐 수 있어. 사실관계가 충돌하면 최신 ‘팩트체크와 근거’ 표와 공식 공고를 우선해.</div>'

function audit(){return section('심층조사 핵심 팩트체크 '+D.factAudit.length+'건','자료의 시점·적용범위 구분')
+'<div class="card" style="overflow-x:auto"><table class="fact-audit"><thead><tr><th>쟁점</th><th>검증 결과</th><th>판정</th><th>근거</th></tr></thead><tbody>'+D.factAudit.map(f=>{const src=D.sources.find(s=>s.id===f.ref);return '<tr><td>'+escape(f.topic)+'</td><td>'+escape(f.statement)+'</td><td><span class="audit-badge '+(/미확정|주의/.test(f.status)?'pending':/이전|부분/.test(f.status)?'previous':'')+'">'+escape(f.status)+'</span></td><td>'+(src?'<a target="_blank" rel="noopener noreferrer" href="'+escape(src.url)+'">'+escape(f.ref)+' ↗</a>':escape(f.ref))+'</td></tr>'}).join('')+'</tbody></table></div>';}

<div class="grid grid-4"><div class="card kpi"><div class="kpi-name">핵심 면접 답변</div><div class="kpi-value">04<span class="mark-number">/</span>04</div><small>60초 / 상세 버전, 타이머</small></div><div class="card kpi"><div class="kpi-name">예상 꼬리질문</div><div class="kpi-value">${String(D.followups.length).padStart(2,'0')}</div><small>학습 완료 ${q}개 · 질문별 답변</small></div><div class="card kpi"><div class="kpi-name">석사 학업 시뮬레이션</div><div class="kpi-value">04</div><small>학기 · 학점 · 산출물 · 실패 대안</small></div><div class="card kpi"><div class="kpi-name">보존한 조사 이력</div><div class="kpi-value">47</div><small>원문 전체 · 자료별 검증 표시</small></div></div>
<div class="quote-strip"><div class="quote-mark">“</div><p>${escape(D.overviewKey)}</p><div class="quote-note">CORE NARRATIVE</div></div>
<div class="atelier-launch"><div><strong>하나로 끝내는 면접 준비</strong><p>핵심 4문항 → 꼬리질문 ${D.followups.length}개 → 무작위 모의면접 → 면접 직전 한 장. 필요한 근거는 심층 검증 자료실에 남겨뒀어.</p></div>${btn('실전 모의면접 →','go:mock','primary')}${btn('직전 한 장','go:briefing','tiny')}</div>

function timerDisplay(s){const el=$('#timer-'+s);if(!el)return;const n=state.elapsed;const mm=String(Math.floor(n/60)).padStart(2,'0'),ss=String(n%60).padStart(2,'0');const digits=el.querySelector('.timer-digits');digits.textContent=`${mm}:${ss}`;digits.classList.toggle('over',n> (state.duration==='short'?60:110));el.querySelector('.timer-fill').style.width=Math.min(100,(n/(state.duration==='short'?60:110))*100)+'%';const b=el.querySelector('[data-action^="timer:"]');if(b)b.textContent=state.timer?'Ⅱ 일시정지':'▶ 시작'}
function clearTimer(){if(state.timer)clearInterval(state.timer);state.timer=null;state.timerStart=null;state.elapsed=0;state.activeScript=null}

 if(a==='mockReset'){stopMock();state.mockSeconds=0;render();return}
 if(a==='mockTimer'){if(state.mockInterval){stopMock();render();return}const then=Date.now()-state.mockSeconds*1000;state.mockInterval=setInterval(()=>{state.mockSeconds=Math.floor((Date.now()-then)/1000);formatMockTime()},250);e.target.textContent='■ 일시정지';return}
 if(a==='focus'){toggleFocus();return}
 if(a==='randomQuestion'){state.followFilter='전체';state.qSearch='';render();const i=Math.floor(Math.random()*D.followups.length),el=$('#question-'+i);el?.classList.add('open');el?.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(a.startsWith('timer:')){runTimer(a.split(':')[1]);return}
 if(a.startsWith('resetTimer:')){clearTimer();for(const s of D.scripts)timerDisplay(s.id);return}
 if(a.startsWith('blur:')){let id=a.split(':')[1];setcheck('blur-'+id,!checked('blur-'+id));render();return}

 if(a.startsWith('copyq:')){const s=D.followups[Number(a.split(':')[1])];copy('Q. '+s.question+'\nA. '+s.answer);return}

/* Cloudflare에서 HTTPS로 열렸을 때만 앱 설치와 개인 공간 잠금 기능을 켠다. */
(function(){
  const lock=document.getElementById('cloudLock');
  if(lock && location.protocol==='https:') lock.hidden=false;
  if(location.protocol!=='https:' || !('serviceWorker' in navigator)) return;
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'})
    .catch(e=>console.warn('Install helper unavailable',e)));
  let promptEvent;
  const install=document.getElementById('installPromptBtn');
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();promptEvent=e;if(install)install.hidden=false;
  });
  if(install)install.addEventListener('click',async()=>{
    if(!promptEvent)return;
    promptEvent.prompt();
    await promptEvent.userChoice.catch(()=>null);
    install.hidden=true;promptEvent=null;
  });
  window.addEventListener('appinstalled',()=>{if(install)install.hidden=true;});
})();
</script>

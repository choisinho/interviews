window.HONGIK_DATA = {"scripts":[{"id":"motivation","no":"01","title":"자기소개 및 학과 지원동기","eng":"WHY HERE","core":"현장 문제를 연구문제로 바꾸고 싶다","hooks":["전산직 군무원 / WMS","숙련자 의존과 인수인계","AI·국방운영의 융합"],"short":"현재 군에서 전산직 군무원으로 근무하면서 물류정보체계와 창고관리시스템의 운영·유지보수를 담당하고 있습니다. 업무 중에는 화면 프로그램과 서버, 데이터베이스, 자동화설비의 연관관계를 함께 살펴야 하는 장애를 자주 경험했습니다. 특히 오래된 체계는 신규 담당자가 구조를 익히는 데 시간이 많이 걸리고, 숙련자의 경험에 의존하기 쉽다는 문제를 느꼈습니다. 그래서 단순히 장애를 그때그때 해결하는 데서 벗어나, AI와 데이터 분석을 통해 원인 탐색과 인수인계를 체계화하는 방법을 연구하고 싶었습니다. AI 기술과 국방 운영을 함께 다루는 홍익대 국방AI융합학과가 제 실무 경험을 연구로 발전시키기에 적합하다고 판단해 지원했습니다.","long":"현재 군에서 전산직 군무원으로 근무하며 군 물류 관련 정보체계와 창고관리시스템인 WMS의 운영·유지보수를 맡고 있습니다. 처음에는 본래 편제상 제 담당이 아니었던 WMS 유지보수를 대리하며 업무를 배웠습니다. 데이터베이스 조회나 서버 프로그램 수정부터 자동화설비 연계, 백업체계 점검까지 문제의 위치를 직접 추적해야 했습니다. 예를 들어 물류현장에서 바코드 인식이 원활하지 않아 출력구조를 수정했던 적이 있고, 화면 조회에 필요한 항목을 추가하면서 데이터 구조와 서버 프로그램을 함께 확인한 경험도 있습니다. 이런 경험을 통해 오래된 물류체계에서는 한 사람이 화면, 코드, DB, 현장 업무의 관계를 많이 알아야 하고, 그 지식이 충분히 공유되지 않으면 담당자 교체 시 같은 문제를 반복해서 분석하게 된다는 점을 느꼈습니다. 지금까지는 문제를 해결하는 데 집중했지만, 이제는 왜 이러한 진입장벽이 생기는지 체계적으로 분석하고 싶습니다. 홍익대 국방AI융합학과에서는 AI와 데이터 분석뿐 아니라 군수 운영·공급사슬관리까지 함께 배워 이 문제를 연구 가능한 형태로 발전시키고 싶습니다.","tip":"구체적 사례는 한 가지만 말하고, 질문이 들어오면 나머지를 꺼내. 모델 이름부터 말하지 마.","risk":"“AI가 모든 장애를 해결한다”는 주장 금지.","micro":"군에서 전산직 군무원으로 WMS를 유지보수하며 화면·서버·DB·자동화설비가 연결된 장애를 다뤘습니다. 바코드 출력과 조회 화면을 수정하면서 신규 담당자의 높은 진입장벽을 느꼈습니다. 이 문제를 AI·데이터와 국방 운영의 관점에서 검증 가능한 연구로 발전시키고 싶어 지원했습니다.","references":["S14","S1"]},{"id":"study","no":"02","title":"입학 후 계획","eng":"WHAT TO LEARN","core":"기초 → 운영 이해 → 작은 연구 실험","hooks":["기초·검증·보안","공급사슬관리·의사결정","모사 데이터 기반 비교실험"],"short":"입학 후에는 먼저 데이터사이언스와 AI, 정보보호의 기초를 보완하겠습니다. 실무에서 생성형 AI를 코드 해석과 SQL 작성에 사용한 경험은 있지만, 결과가 왜 나왔고 얼마나 신뢰할 수 있는지 판단하는 능력은 더 배워야 한다고 생각합니다. 이어서 공급사슬관리와 의사결정·최적화 분야를 공부해 WMS를 물류 운영 전체의 관점에서 이해하고 싶습니다. 연구는 신규 담당자가 장애 원인을 찾을 때 코드, DB 구조, 로그, 과거 기록을 연결해 보여주는 읽기 중심의 AI 보조방식을 검토하고자 합니다. 보안상 실제 자료 사용이 어렵다면 모사 데이터를 먼저 만들고, 기존 검색 방식과 비교해 탐색시간과 정확도를 측정하겠습니다.","long":"첫 학기에는 AI와 데이터 분석의 기본 원리, 정보보호, 결과 검증 방법을 우선 공부하겠습니다. 현재도 생성형 AI로 SQL 초안을 작성하거나 오래된 코드를 해석하지만, 모델이 제시한 답이 실제 데이터 구조와 맞지 않는 경우가 있기 때문에 검증 역량을 갖추는 것이 중요하다고 생각합니다. 두 번째 단계에서는 AI 및 데이터 기반 공급사슬관리, 의사결정·최적화 관련 학습을 통해 입출고와 재고관리, 자동화설비 연동을 물류 흐름 전체의 관점에서 보겠습니다. 이후 지도교수의 조언과 선행연구를 바탕으로 신규 담당자의 원인 탐색 과정 중 좁은 부분부터 연구하겠습니다. 예를 들면 특정 유형의 장애를 보고받았을 때 연관된 코드·테이블·로그·과거 조치기록을 찾는 문제입니다. 처음부터 운영체계에 AI를 연결하기보다 보안상 허용되는 구조의 모사 코드와 테스트 DB를 만들고, 사람이 직접 검색하는 방법, 일반 생성형 AI를 사용하는 방법, 근거를 검색해 제공하는 RAG 보조방식을 비교해 보겠습니다. 탐색시간과 관련 자료 식별 정확도, 잘못된 확신 등을 평가하고, 운영체계에 대한 자동 수정은 연구 범위에서 제외하겠습니다. 실제 과목 개설과 학위청구 방식은 입학 뒤 강의계획서와 학과 지도를 받아 조정하겠습니다.","tip":"학과의 모든 과목을 실제로 수강할 수 있다는 전제 대신 “개설 시 선택”이라고 표현.","risk":"입학 직후 에이전트를 완성한다는 식의 개발 약속 금지.","micro":"AI·데이터 분석과 정보보호의 기초부터 배우고 군수 운영의 관점까지 확장하겠습니다. 연구는 코드·DB·로그·장애이력을 찾는 읽기전용 RAG 진단보조를 독립 모사자료로 만들고, 기존 방식과 탐색시간·정확도를 비교하는 방향입니다. 연구범위와 과목 선택은 지도교수와 상의하겠습니다.","references":["S4","R01"]},{"id":"after","no":"03","title":"졸업 후 포부","eng":"AFTER GRADUATION","core":"개인 노하우를 조직이 재사용할 지식으로","hooks":["인수인계·장애이력 표준화","근거 제시형 진단 보조","검증 후 작은 현장 적용"],"short":"졸업 후에는 연구 결과를 현재의 군 물류정보체계 유지보수 업무에 다시 적용하고 싶습니다. 특히 담당자가 바뀔 때마다 기존 장애를 처음부터 추적하지 않도록 코드와 데이터 구조, 장애기록의 연결관계를 체계적으로 정리하는 것이 첫 목표입니다. AI 보조도구가 실제로 탐색시간을 줄이고 정확도를 높인다는 근거가 확인된다면, 보안과 승인절차를 지키면서 인수인계나 장애 대응절차에 단계적으로 활용하겠습니다. AI를 도입하는 것 자체보다, 숙련자 공백이 생겨도 안정적으로 운영할 수 있는 업무방식을 만드는 것이 제 목표입니다.","long":"졸업 이후에도 군의 물류정보체계를 운영하는 실무자로서 연구성과를 현장에 돌려놓고 싶습니다. 제가 겪은 유지보수의 어려움은 단순히 코드가 오래됐기 때문만은 아닙니다. 업무처리 절차와 코드, 데이터 구조, 장비와 타 체계의 연동관계가 숙련자의 경험 속에 흩어져 있다는 점이 더 큰 문제라고 생각합니다. 그래서 우선 반복 장애를 유형별로 분류하고, 원인을 확인하는 순서와 관련 자료, 조치 뒤 검증 방법까지 기록할 수 있는 인수인계 체계를 개선하고 싶습니다. 대학원 연구에서 RAG 기반 보조도구의 효과가 확인된다면 읽기 전용 검색과 출처 제시 같은 저위험 기능부터 소속기관의 승인을 받아 검토할 수 있을 것입니다. 반대로 AI 성능이 충분하지 않다면 무리하게 도입하지 않고, 정리된 지식베이스와 장애 대응 절차만 먼저 활용할 수 있다고 생각합니다. 최종 목표는 AI 개발 자체가 아니라, 담당자 변경이나 숙련자의 부재에도 안정성과 보안을 유지하는 운영 체계를 만드는 것입니다.","tip":"현장으로 돌아와서 재사용할 결과물을 말해. 전군 확산, 자동수정, 제도 신설을 약속하지 마.","risk":"보안 승인 전 실제 운영DB 접근/공개를 전제로 말하지 마.","micro":"졸업 후에는 숙련자가 알고 있던 장애이력과 코드·DB 연결관계를 체계적으로 정리해 인수인계에 활용하고 싶습니다. AI 보조가 효과적이라는 실험 근거가 확인될 때만 보안 승인 아래 단계적으로 검토하겠습니다. 기술 자체보다 지속 가능한 운영방식을 남기는 것이 목표입니다.","references":["S13","R05"]},{"id":"evening","no":"04","title":"야간수업 가능 여부","eng":"CAN YOU ATTEND","core":"시간표를 이미 확인했고 예외까지 대비한다","hooks":["세종 근무·거주","저녁시간대 실제 편성 확인","주간·대면 일정 사전 조정"],"short":"현재 세종 지역에서 근무하고 거주하고 있어서 세종캠퍼스로 이동하는 데 큰 부담이 없습니다. 지원 전 실제 개설 시간표를 살펴봤고, 평일 저녁에 운영되는 과목이 다수 있다는 점도 확인했습니다. 따라서 근무 후 수업에 참여하는 방식이 현실적으로 가능하다고 판단했습니다. 다만 모든 과목이 저녁이나 온라인으로 운영되는 것은 아니므로 학기별 시간표를 확인해 수강계획을 세우겠습니다. 주간 대면수업이나 세미나, 지도교수 면담이 필요할 경우에는 소속기관의 근무 조정과 휴가 절차를 미리 검토하고, 야근이나 출장과 충돌하지 않도록 관리하겠습니다.","long":"저는 현재 세종 지역에서 근무하고 거주하고 있어 학교 접근성 면에서 유리한 조건에 있습니다. 지원하기 전에 실제 개설 시간표를 살펴보니 19시부터 22시까지 운영되는 과목이 여러 개 있었고, 일부는 18시에 시작하거나 토요일에 진행되는 경우도 있었습니다. 이 때문에 처음부터 모든 강의가 야간 또는 온라인이라고 가정하지 않았습니다. 기본적으로는 근무 후 저녁수업을 수강하고, 비수업일에는 복습과 과제를 수행하며, 주말 반나절을 문헌조사와 연구기록에 배정할 계획입니다. 9학점을 수강하면 3학점 과목을 세 개 듣는 것이므로 실제 배정에 따라 평일 두세 차례 수업이나 토요일 일정까지 고려해야 합니다. 또 학교의 일반 수업 지침은 대면을 원칙으로 하면서 군위탁 학생 등을 별도 예외로 정하기 때문에, 제 전형과 해당 과목의 수업방식도 학기마다 확인하겠습니다. 주간 대면 세미나나 교수 면담이 필요하면 사전에 근무일정과 휴가를 조정하고, 정기적인 야근·출장이 있는 시기에는 과제 마감과 출석을 최우선으로 관리하겠습니다. 즉 가능하다는 말만 하기보다, 실제 시간표와 근무 여건을 맞춰 지속 가능한 계획을 세워놓았습니다.","tip":"“무조건 가능”보다 “변수들을 확인했고 합법적인 일정 조정으로 대응”에 집중.","risk":"주간 행정분류와 실제 저녁 편성을 혼동하지 마.","micro":"현재 세종에서 근무·거주하고, 2026년 시간표에서 저녁 수업 사례를 확인했습니다. 하지만 모든 강의가 야간·온라인이라는 보장은 없으므로 실제 개설과 출석 방식에 따라 계획을 조정하겠습니다. 주간 대면 일정은 소속기관의 정해진 근무·휴가 절차를 따르겠습니다.","references":["S4","P47"]}],"followups":[{"question":"왜 지금 대학원에 가려고 하나?","answer":"실무에서 반복적으로 같은 유형의 문제를 해결했지만, 그 경험이 조직의 표준 지식으로 남지 못한다는 한계를 느꼈습니다. 이제 문제를 체계적으로 정의하고 효과를 검증하는 연구방법을 배우고 싶습니다.","tag":"동기"},{"question":"왜 홍익대 국방AI융합학과여야 하나?","answer":"AI 개발뿐 아니라 국방 운영, 공급사슬관리, 의사결정까지 함께 다루기 때문입니다. WMS 문제는 기술과 물류 운영을 함께 알아야 해결할 수 있습니다.","tag":"동기"},{"question":"다른 AI·컴퓨터공학 대학원은 왜 아닌가?","answer":"컴퓨터공학의 심화도 중요하지만 제가 연구하고자 하는 문제는 물류정보체계가 실제 국방 조직에서 어떻게 운영되는지와 직접 연결됩니다. 국방 현장과 AI를 같이 다루는 융합교육이 현재 목적과 맞습니다.","tag":"동기"},{"question":"본인이 한 가장 구체적인 개선은?","answer":"현장에서 바코드 인식이 잘 안 되는 문제를 겪어 출력구조를 점검하고 수정했습니다. 단순 출력 오류가 아니라 설비의 인식 조건과 물류 절차까지 함께 봐야 했습니다.","tag":"실무"},{"question":"조회 컬럼을 추가한 경험을 설명해봐.","answer":"현장 요구에 맞게 화면에 보여줄 데이터가 무엇인지 먼저 확인한 뒤, 데이터베이스 조회와 서버 프로그램 간 연결관계를 점검했습니다. 전산 수정이 업무 의미와 맞는지도 함께 확인했습니다.","tag":"실무"},{"question":"WMS 유지보수가 왜 특별히 어려운가?","answer":"화면, 서버 코드, 데이터베이스, 장비와 타 체계가 연결되어 있고 오래된 코드에 대한 문서와 인수인계가 부족하기 때문입니다. 증상이 발생한 위치와 실제 원인이 다른 경우가 있습니다.","tag":"실무"},{"question":"AI가 없는 기존 방식과 무엇을 비교하나?","answer":"직접 자료를 찾는 방식, 사람이 자료를 넣어 일반 생성형 AI를 쓰는 방식, 관련 자료를 검색해 근거를 제시하는 방식의 세 조건을 비교하려 합니다.","tag":"연구"},{"question":"RAG란 무엇인가?","answer":"모델의 기존 지식만으로 답하는 대신, 질문과 관련된 코드 설명이나 문서 등을 먼저 검색해서 답변의 근거로 제공하는 방식입니다. 모델 답변에 참조 위치를 붙여 검증할 수 있게 하는 것이 중요합니다.","tag":"연구"},{"question":"RAG와 에이전트는 같은 개념인가?","answer":"아닙니다. RAG는 관련 정보를 검색해 답변에 활용하는 구조이고, 에이전트는 과제에 따라 검색·조회 등 도구를 선택하고 순서를 조정하는 접근입니다. 석사 연구에서는 먼저 단순 RAG의 효과부터 검증하고 확장 여부를 판단하겠습니다.","tag":"연구"},{"question":"정확도는 어떻게 정의하나?","answer":"사전에 사람이 검증한 정답 파일·테이블·로그 목록을 만들고, 필요한 자료가 상위 검색 결과에 포함되는지 평가합니다. 원인 후보 정확도와 허위근거 제시 여부도 구분해 보겠습니다.","tag":"연구"},{"question":"연구의 독창성은 어디에 있나?","answer":"새 모델을 만드는 것이 아니라 유지보수 지식의 연결구조와 검색근거를 설계하고, 신규 담당자의 탐색시간과 오판 위험에 어떤 차이가 나는지 실증적으로 측정하는 데 있습니다. 다만 선행연구 검토를 통해 차별성을 더 정교화하겠습니다.","tag":"연구"},{"question":"표본이 작다면 연구가 성립하나?","answer":"초기에는 대표 장애 유형과 작은 모사 데이터셋으로 재현성 있는 실험을 설계하겠습니다. 일반화에는 한계가 있다는 점을 명시하고 평가 기준과 실험 절차를 투명하게 기록하겠습니다.","tag":"연구"},{"question":"군 자료를 논문에 그대로 쓰나?","answer":"그렇지 않습니다. 기본은 실제 구조와 식별정보를 반영하지 않는 독립적인 모사 코드·가상 DB·합성 로그입니다. 실제 자료가 필요하면 소속기관의 승인과 보안 검토가 먼저입니다.","tag":"보안"},{"question":"비식별하면 무조건 공개해도 되나?","answer":"아닙니다. 비식별 처리만으로 반출 허가가 성립하는 것은 아닙니다. 군 내부 자료에서 파생된 정보도 보안성 검토와 자료 활용 승인을 받아야 하므로, 승인 없이 공유하지 않겠습니다.","tag":"보안"},{"question":"모델이 틀린 답을 내면?","answer":"출처가 없는 단정은 신뢰하지 않고, 사람이 실제 코드와 DB 구조를 대조해 판단하게 하겠습니다. 운영환경의 자동 변경권한은 주지 않는 방향입니다.","tag":"보안"},{"question":"AI를 도입하지 못하면 연구 실패인가?","answer":"꼭 그렇지는 않습니다. AI가 충분한 개선을 보이지 않는다는 결과도 연구결과가 될 수 있습니다. 장애 분류체계와 근거 지식베이스만으로도 인수인계 개선에 활용할 여지가 있습니다.","tag":"연구"},{"question":"AI 전공 기초가 부족하지 않나?","answer":"실무 코드를 분석하고 SQL을 다룬 경험은 있지만 통계, 모델 평가, AI 원리는 더 공부해야 합니다. 그래서 첫 학기부터 기초와 검증방법을 우선적으로 보완하겠습니다.","tag":"학업"},{"question":"어떤 과목을 실제로 듣겠나?","answer":"데이터 사이언스, 정보보호 및 보안, 공급사슬관리, 의사결정·최적화 과목을 우선 후보로 보고 있습니다. 다만 실제 개설과 시간표, 지도교수 의견을 확인한 뒤 선택하겠습니다.","tag":"학업"},{"question":"학위논문이 목표인가?","answer":"실무 개선만으로 끝내지 않고 비교실험과 평가를 담은 연구결과를 만들고 싶습니다. 학과가 허용하는 학위청구 방식과 지도교수 의견을 확인해 논문 여부를 정하겠습니다.","tag":"학업"},{"question":"3학기 안에 24학점을 취득할 수 있나?","answer":"주간 석사 논문·개별연구과제 방식의 일정에서는 4학기 발표 요건을 고려해 앞선 학기에 학점 이수계획을 세워야 합니다. 예컨대 9·9·6학점을 고려하되 실제 규정과 학과 편성을 확인하겠습니다.","tag":"학업"},{"question":"현재 직무와 학업이 겹치면?","answer":"정규수업 출석을 중심으로 근무일정·휴가를 미리 조정하겠습니다. 긴급 업무는 부서 내 인수인계와 협업을 활용하되, 승인되지 않은 근무이탈을 전제로 하지는 않겠습니다.","tag":"병행"},{"question":"야간 수업이 전부 온라인이라고 생각하나?","answer":"아닙니다. 학기별로 대면 원칙과 군위탁 예외를 따로 확인해야 하고 일부 주간·토요일 수업도 있을 수 있다고 파악했습니다.","tag":"병행"},{"question":"취학추천은 끝났나?","answer":"군 내부 절차와 학교의 군위탁 전형 반영 여부는 서로 구분해서 확인하고 있습니다. 현재 단계에서 최종 완료 여부가 확인되지 않은 부분은 완료됐다고 단정하지 않겠습니다.","tag":"행정"},{"question":"졸업 뒤 다른 기관으로 발령나면?","answer":"기술 자체보다 장애 분류표, 탐색 절차, 검증 프로토콜 같은 재사용 가능한 결과물을 남기겠습니다. 특정 시스템에만 종속되지 않게 설계하려 합니다.","tag":"진로"},{"question":"서울캠퍼스 연구실을 활용할 계획인가?","answer":"세종캠퍼스와 소속 학과 수업이 우선입니다. 꼭 필요한 타과 수업이나 연구교류가 있다면 지도교수와 승인 절차, 실제 출석 가능성을 따져 제한적으로 검토하겠습니다.","tag":"학업"},{"question":"왜 대학원이어야 하나? AI 강의만 들으면 안 되나?","answer":"AI 사용법과 연구·검증 능력은 다릅니다. 실제 효과를 비교실험과 통계·오류분석으로 평가하는 역량, 지도교수의 연구지도가 필요하다고 판단했습니다.","tag":"동기"},{"question":"왜 일반 컴퓨터공학과가 아닌 국방AI융합학과인가?","answer":"문제는 코드만이 아니라 입출고·재고관리·군수운영과 인수인계가 결합돼 있습니다. 기술과 국방 운영을 함께 다루는 교육방향이 제 질문에 적합합니다.","tag":"동기"},{"question":"RAG를 쓰면 환각이 없어지나?","answer":"아닙니다. 잘못 검색한 문서가 답변을 오염시킬 수 있으므로 자원 검색 적중률과 생성 답변의 근거충실성을 별도로 평가하고 사람이 확인하겠습니다.","tag":"기술"},{"question":"에이전틱 RAG와 일반 RAG의 차이는?","answer":"RAG는 검색자료를 생성 답변에 제공하는 구조입니다. 에이전틱 확장은 질문에 따라 읽기전용 검색도구를 선택·순차 호출하는 개념이며 석사과정에선 기본 RAG 검증이 먼저입니다.","tag":"기술"},{"question":"Recall@k는?","answer":"정답 관련 문서나 함수가 검색 결과 상위 k개에 얼마나 포함되는지 측정하는 지표입니다. 문서 하나가 정답인 과제와 여러 자원이 정답인 과제를 구별해 평가합니다.","tag":"실험"},{"question":"RAG가 기존 검색보다 못하면?","answer":"그 결과와 오류 원인을 보고하겠습니다. AI를 무조건 도입하지 않고 정리된 장애기록과 검색체계만으로도 개선 가능한지 검토하겠습니다.","tag":"반박"},{"question":"비논문 30학점 졸업이 가능한가?","answer":"일반대학원에는 교과목이수 방식이 안내돼 있지만 해당 학과가 실제 허용하는지는 별도 확인이 필요합니다. 입학 뒤 학과 규정과 지도교수 상담을 기준으로 계획하겠습니다.","tag":"학사"},{"question":"왜 9·9·6학점으로 계획했나?","answer":"2026 대학원 공통 안내의 학기당 6~9학점과 논문 4학기 발표를 위한 3학기까지 24학점 조건을 역산한 예시입니다. 2027 실제 과목 개설을 확인한 후 조정하겠습니다.","tag":"학사"},{"question":"야간수업이 열리지 않는 학기라면?","answer":"과거 저녁 수업은 실제 2027년 개설 보장이 아닙니다. 시간표와 출석 정책에 맞춰 수강조합을 바꾸고 공식 근무조정이나 휴가를 검토하겠습니다.","tag":"병행"},{"question":"등록금 50% 지원은 4학기 동안 확정됐나?","answer":"현재까지 확보한 장학 안내와 실제 적용·재직 증빙 및 추천 갱신 절차는 구분해서 봐야 합니다. 학기별 요건을 학교에 확인하겠습니다.","tag":"행정"},{"question":"정원외 취학추천이 군 내부 자료 사용도 허가하나?","answer":"아닙니다. 취학추천은 입학 관련 행정절차이고, 군 내부자료를 대학·외부 AI에서 사용하는 것은 별도 보안·자료활용 승인사항입니다.","tag":"보안"},{"question":"Private GitHub에 군 내부 코드를 올려도 되나?","answer":"아닙니다. 비공개 저장소라도 소속기관에서 승인한 보안 저장영역은 아니므로 실운영 코드·로그·식별정보를 올리지 않겠습니다.","tag":"보안"},{"question":"실험 참가자를 못 구하면?","answer":"사람 대상 탐색시간 효과는 단정하지 않고, 정답이 검증된 독립 가상 사례에서 검색 정확도·근거충실성·위험 제안율을 오프라인 평가하겠습니다.","tag":"실험"},{"question":"합성 데이터가 실제 WMS를 대표하나?","answer":"완전히 대표하지 못합니다. 여러 단계의 연결과 잘못된 단서, 버전 차이를 넣되 실제 현장으로 일반화하는 데 한계가 있다고 명시하겠습니다.","tag":"반박"},{"question":"지식베이스 정리 효과와 LLM 효과는 어떻게 분리하나?","answer":"사람이 직접 자료를 찾는 조건, 사람이 근거를 제공해 LLM을 쓰는 조건, 자동 검색한 근거를 제공하는 RAG 조건을 비교하겠습니다.","tag":"실험"},{"question":"AI가 UPDATE/DELETE를 제안한다면?","answer":"읽기전용 모사 실험환경만 사용하고 쓰기·배포 권한을 주지 않겠습니다. 잘못된 행동 제안은 안전성 평가의 오류로 기록하며 사람 승인없이 실행하지 않습니다.","tag":"보안"},{"question":"졸업 후 현장에 바로 배포할 계획인가?","answer":"학위 취득과 군 시스템 도입은 별개입니다. 먼저 장애 분류·탐색절차·인수인계 템플릿을 남기고, 실증 결과와 보안승인 후 제한적으로 검토하겠습니다.","tag":"진로"},{"question":"과제 순서에 따른 학습효과는 어떻게 통제하나?","answer":"유사 난이도의 다른 모사 사례를 나누고 조건 순서를 교차하겠습니다. 표본이 작으면 결과의 불확실성과 한계를 명시하겠습니다.","tag":"실험"},{"question":"졸업논문이 4학기 안에 안 끝난다면?","answer":"4학기 완료는 목표이지 보장은 아닙니다. 연구 범위를 줄이고 지도교수와 학교 학위일정을 재설계하겠습니다. 검증되지 않은 성과를 만들어내지 않겠습니다.","tag":"반박"}],"terms":[{"term":"WMS","meaning":"Warehouse Management System. 입·출고·재고·보관작업 등 창고 운영을 지원하는 정보체계."},{"term":"레거시 시스템","meaning":"오래전에 구축되어 기존 기술·코드·업무규칙을 유지하면서 운영되는 체계."},{"term":"Pro*C","meaning":"C 코드 안에 Oracle SQL을 포함해 사전컴파일하는 개발 방식."},{"term":"ZPL","meaning":"Zebra Programming Language. 라벨 프린터 출력 형식을 지정하는 명령 언어."},{"term":"RAG","meaning":"Retrieval-Augmented Generation. 질문에 필요한 근거를 먼저 검색한 뒤 생성형 모델에 제공하는 방식."},{"term":"에이전트","meaning":"목표에 맞춰 도구 호출과 작업 단계를 선택·조정하는 소프트웨어 구성. 무조건 자율적 실행을 뜻하지 않음."},{"term":"환각","meaning":"생성형 모델이 근거 없이 그럴듯한 내용을 사실처럼 제시하는 현상."},{"term":"검색 적중률","meaning":"검증된 관련 자료가 검색 결과 상위 k개 안에 들어오는 비율(Recall@k 등)."},{"term":"골드 스탠더드","meaning":"사람이 사전에 검증해 만든 정답 또는 기준 평가자료."},{"term":"읽기 전용","meaning":"운영 데이터나 코드를 변경하는 권한 없이 조회·검색·분석만 허용하는 원칙."},{"term":"데이터 누출","meaning":"허가되지 않은 경로로 보호 대상 정보가 외부로 전달되는 위험."},{"term":"공급사슬관리","meaning":"공급·보관·재고·수송 등 자원 흐름을 전체적으로 계획하고 조정하는 분야."}],"semesters":[{"phase":"1학기","date":"2027.03 — 2027.08","title":"기초와 문제 정의","credits":"예시 9학점","courses":["데이터 사이언스","정보보호 및 보안","국방 소프트웨어 관리"],"goals":["2027 실제 개설과 강의계획서 확인, 선수과목 여부 점검","AI·통계·평가지표의 기초 보완","지도교수 상담과 연구질문 1쪽 작성","선행연구 검색표 20편 내외 정리(목표치)","군 자료와 완전히 독립된 모사 사례 2~3개 구성"],"deliver":"문제정의서 1쪽 + 선행연구 표 + 모사 사례","caveat":"과목명은 교육과정 후보야. 2027 실제 개설을 의미하지 않아."},{"phase":"2학기","date":"2027.09 — 2028.02","title":"군수 운영을 이해하고 설계","credits":"예시 9학점","courses":["AI 및 데이터 기반 공급사슬관리","AI 기반 의사결정 및 최적화 모델","국방 AI 기술 응용"],"goals":["입출고·재고·자동화의 운영 관점을 연구에 반영","평가에 쓸 합성 코드·가상 DB·로그 묶음 설계","비교 대상 3조건과 정답 데이터 기준 확정","학위청구 방식과 학과별 허용요건 확인","필요시 타과전공 0~1과목 가능성 검토"],"deliver":"실험설계서 + 모사 데이터셋 v1 + 평가 체크리스트","caveat":"논문·개별연구과제·교과목 이수 중 학과 허용방식을 반드시 확인."},{"phase":"3학기","date":"2028.03 — 2028.08","title":"작은 비교실험","credits":"예시 6학점","courses":["연구에 필요한 개설 교과목 2개 선택"],"goals":["직접 검색 / 일반 LLM / 근거검색 기반 보조 비교","동일 과업, 동일 시간제약, 무작위 과업순서로 편향 완화","탐색시간, 관련자료 식별률, 잘못된 확신률 측정","실패사례와 연구 한계를 따로 기록","필요한 학위시험·연구윤리·학위청구 요건 준비"],"deliver":"실험 결과표 + 실패사례 분석 + 보고서 초안","caveat":"4학기 발표를 노리는 주간 석사는 이전 3학기 24학점 요건을 확인."},{"phase":"4학기","date":"2028.09 — 2029.02","title":"검증·논문·현장 환류","credits":"논문 경로: 0학점 수강 가능 여부 확인 / 학점 경로: 잔여 3학점 등","courses":["선택한 학위청구 방식에 맞춰 운영"],"goals":["재현성 점검, 오답·한계 분석과 학위 산출물 완성","교수 피드백을 바탕으로 결과 해석 수정","업무자료 반출 없는 공개 가능한 연구 결과 정리","현장 인수인계 템플릿으로 변환","실제 적용은 별도 보안·운영 승인 후 검토"],"deliver":"학위 산출물 + 인수인계·장애기록 템플릿","caveat":"최종 학위조건, 연구·시험·학점 일정은 학과 및 최신 학사공지 기준."}],"sources":[{"id":"S1","name":"2027학년도 전기 대학원 신입생 모집 (군위탁 포함)","url":"https://www.hongik.ac.kr/kr/admission/notice-military.do?article.offset=0&articleLimit=10&articleNo=157298&mode=view","what":"2027 전기 모집 공지: 세종 면접 11/7. 구체사항 11/5 예정과 학과별 면접 시작시각 11/6 예정은 서로 다른 공지 단계.","kind":"공식","date":"2026.09.18"},{"id":"S2","name":"2027학년도 전기 대학원 신입생 모집 안내","url":"https://www.hongik.ac.kr/kr/newscenter/notice.do?articleNo=157416&mode=view&noCat=381","what":"세종 대면 구술면접 2026-11-07","kind":"공식","date":"2026.09.21"},{"id":"S3","name":"국방AI융합학과 공식 교육과정","url":"https://gbai.hongik.ac.kr/gbai/0401.do","what":"교육과정 목록 (동적 사이트라 표시된 과목은 추가 학기별 확인 필요)","kind":"공식","date":"상시"},{"id":"S4","name":"2026학년도 1학기 대학원 수강 안내","url":"https://www.hongik.ac.kr/kr/newscenter/notice.do?articleNo=147598&mode=view","what":"대면 원칙·군위탁 예외, 주간 석사 6~9학점, 타과 9학점, 학위 조건","kind":"공식","date":"2026.02"},{"id":"S5","name":"2026학년도 2학기 대학원 수강신청 정정 안내","url":"https://www.hongik.ac.kr/kr/education/notice-grad.do?articleNo=155808&mode=view","what":"타과 전공 총 9학점 등 운영 규정 재확인","kind":"공식","date":"2026.08"},{"id":"S6","name":"석사학위청구 교과목이수 안내","url":"https://grad00.hongik.ac.kr/common_pdf/guide06_06.pdf","what":"논문/개별연구과제 24학점, 교과목 30학점. 학과별 허용방법 확인 필요","kind":"공식","date":"안내자료"},{"id":"S7","name":"국방AI융합학과 설립 소개","url":"https://gbai.hongik.ac.kr/gbai/0301.do?articleNo=119562&mode=view","what":"2025년 신설과 군 재직자 대상 과정 방향, 취학추천 장학 관련 소개","kind":"공식","date":"2024.10.02"},{"id":"S8","name":"국방AI융합학과 공식 사이트","url":"https://gbai.hongik.ac.kr/gbai/index.do","what":"학과/교수진/공지/교육과정 최신 공지 확인","kind":"공식","date":"상시"},{"id":"S9","name":"학과 AI 활용 윤리 가이드라인","url":"https://gbai.hongik.ac.kr/gbai/0301.do?articleNo=156353&mode=view","what":"AI 이용 연구의 윤리·저작권·책임성 확인

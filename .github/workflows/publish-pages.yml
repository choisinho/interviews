# GitHub 단독 모바일 웹앱 배포.
# 저장소 공개와 GitHub Pages 활성화 완료 후, 웹앱 코드 변경마다 자동 배포한다.
# 주의: Pages로 배포한 HTML은 공개 웹사이트로 누구나 열람할 수 있다.
name: Publish interview atelier
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate PWA manifest and PNG icons
        run: node scripts/build.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
